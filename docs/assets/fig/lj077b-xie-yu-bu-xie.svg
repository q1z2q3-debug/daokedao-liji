<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">倒或不倒：判据在器，不在食</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="230.0" y="104.0" width="300.0" height="60.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="380.0" y="132.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#25211D" letter-spacing="0.4">君赐余：此器可涤乎？</text>
  <line x1="380.0" y1="164.0" x2="380.0" y2="196.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="170.0" y1="196.0" x2="590.0" y2="196.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="170.0" y1="196.0" x2="170.0" y2="224.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="590.0" y1="196.0" x2="590.0" y2="224.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <rect x="80.0" y="224.0" width="180.0" height="86.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="170.0" y="254.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">不写</text>
  <text x="170.0" y="294.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">陶梓之器：仍于原器中食</text>
  <rect x="490.0" y="224.0" width="180.0" height="86.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="580.0" y="254.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">皆写</text>
  <text x="580.0" y="294.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">萑竹之器：倒于己器乃食</text>
  <text x="170.0" y="340.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.8" fill="#7C6D5C" letter-spacing="0.4">食讫洗器以还君</text>
  <text x="590.0" y="340.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.8" fill="#7C6D5C" letter-spacing="0.4">不污君器，亦不坏君物</text>
  <text x="60.0" y="382.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.3" fill="#25211D" letter-spacing="0.4">注：「重污辱君之器也」——所护者君物之完整，非食物之洁。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　能省而不省：省的是己便，赔的是君器。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 御食于君</text>
</svg>