<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">三戒：取、还、饮，各有一失</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="60.0" y="112.0" width="180.0" height="124.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="150.0" y="142.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">毋抟饭</text>
  <text x="150.0" y="220.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">捏团易得多｜欲致饱</text>
  <rect x="290.0" y="112.0" width="180.0" height="124.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="380.0" y="142.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">毋放饭</text>
  <text x="380.0" y="220.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">弃余于篚或簋盖</text>
  <rect x="520.0" y="112.0" width="180.0" height="124.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="610.0" y="142.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">毋流歠</text>
  <text x="610.0" y="220.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">大歠如水流｜欲疾</text>
  <text x="150.0" y="262.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.0" fill="#994433" letter-spacing="0.4">取</text>
  <text x="380.0" y="262.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.0" fill="#994433" letter-spacing="0.4">还</text>
  <text x="610.0" y="262.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.0" fill="#994433" letter-spacing="0.4">饮</text>
  <text x="60.0" y="304.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">所秽：己之口手所及，不可还于众器。</text>
  <text x="60.0" y="330.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#7C6D5C" letter-spacing="0.4">三条同贯一「争」字：争多、争速。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　共器之食，最易见一个人的贪。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 毋抟饭</text>
</svg>