<text x="196" y="150" font-size="10.5" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">疑女于夫子</text>
<text x="560" y="162" font-size="9.5" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">不称师</text>
