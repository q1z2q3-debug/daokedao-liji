<text x="196" y="224" font-size="10.5" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">丧亲而民未有闻</text>
<text x="560" y="236" font-size="9.5" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">居丧无可称</text>
