<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">四条皆一「嫌」字：不贪，亦不嫌</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="60.0" y="108.0" width="300.0" height="86.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="210.0" y="138.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">毋嚃羹</text>
  <text x="210.0" y="178.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">不嚼菜而吞：有声｜欲速｜伤廉</text>
  <rect x="400.0" y="108.0" width="300.0" height="86.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="550.0" y="138.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">毋絮羹</text>
  <text x="550.0" y="178.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">就器中调盐梅：嫌主人味恶</text>
  <rect x="60.0" y="208.0" width="300.0" height="86.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="210.0" y="238.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">毋剌齿</text>
  <text x="210.0" y="278.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">弄口；口容止</text>
  <rect x="400.0" y="208.0" width="300.0" height="86.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="550.0" y="238.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">毋歠醢</text>
  <text x="550.0" y="278.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">醢宜咸，歠之则示其淡</text>
  <text x="60.0" y="320.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#7C6D5C" letter-spacing="0.4">前一条防己之贪</text>
  <text x="400.0" y="320.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#7C6D5C" letter-spacing="0.4">后三条防主人之疑</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　一半管自己，一半护主人。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 毋嚃羹</text>
</svg>