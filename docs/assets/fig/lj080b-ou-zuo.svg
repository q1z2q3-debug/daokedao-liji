<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">同一条理，两样情境</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="60.0" y="110.0" width="240.0" height="86.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="180.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">御同于长者</text>
  <text x="180.0" y="180.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">侍食而馔与之同</text>
  <rect x="460.0" y="110.0" width="240.0" height="86.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="580.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">偶坐</text>
  <text x="580.0" y="180.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">媲偶于客，或二人并坐</text>
  <line x1="240.0" y1="200.0" x2="330.0" y2="252.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="325.7" y1="246.5" x2="330.0" y2="252.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="323.1" y1="251.0" x2="330.0" y2="252.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="520.0" y1="200.0" x2="430.0" y2="252.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="436.9" y1="251.0" x2="430.0" y2="252.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="434.3" y1="246.5" x2="430.0" y2="252.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <rect x="300.0" y="252.0" width="160.0" height="64.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="380.0" y="282.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">盛馔不为己</text>
  <text x="380.0" y="304.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">馔主在客</text>
  <text x="380.0" y="344.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">既不为自己而设，则不可辞；辞则成虚辞。</text>
  <text x="380.0" y="368.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">疏：「并会两通也」——媲偶、并坐两解并存。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　判据是一，情境是二。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 偶坐不辞</text>
</svg>