<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">一条干肉的方向：左朐右末</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="150.0" y="186.0" width="420.0" height="34.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="150.0" y1="186.0" x2="190.0" y2="196.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="190.0" y1="196.0" x2="150.0" y2="220.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="150.0" y1="186.0" x2="186.0" y2="214.0" stroke="#7C6D5C" stroke-width="0.8"/>
  <rect x="570.0" y="192.0" width="70.0" height="22.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="240.0" y1="180.0" x2="240.0" y2="226.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="330.0" y1="180.0" x2="330.0" y2="226.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="196.0" y="176.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">朐：屈中</text>
  <text x="605.0" y="184.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">末：边际</text>
  <line x1="646.0" y1="203.0" x2="692.0" y2="203.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="685.5" y1="200.4" x2="692.0" y2="203.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="685.5" y1="205.6" x2="692.0" y2="203.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <text x="700.0" y="196.0" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">右手</text>
  <text x="700.0" y="214.0" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">取际擘之</text>
  <text x="60.0" y="262.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">脯：薄折而干，始作即成</text>
  <text x="60.0" y="286.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">脩：棰而施姜桂，治之乃成</text>
  <line x1="60.0" y1="304.0" x2="700.0" y2="304.0" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="60.0" y="336.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#7C6D5C" letter-spacing="0.4">燥为阳，故脯脩处酒左——与「食居人之左」同一序。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　亦便食也：礼之细，细到一条肉的横竖。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 以脯脩置者</text>
</svg>