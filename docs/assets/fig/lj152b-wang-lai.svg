<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#7C6D5C"/></marker></defs><rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.8"/><rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.5"/><text x="380" y="52" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="15" fill="#25211D" text-anchor="middle" letter-spacing="3">通则一条，例外两处</text><line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.2"/><line x1="140" y1="212" x2="620" y2="212" stroke="#7C6D5C" stroke-width="1.2"/><path d="M140 212 L620 212" stroke="#7C6D5C" stroke-width="1" fill="none" marker-end="url(#ah)"/><path d="M620 212 L140 212" stroke="#7C6D5C" stroke-width="1" fill="none" marker-end="url(#ah)"/><circle cx="140" cy="212" r="4" fill="#25211D"/><circle cx="620" cy="212" r="4" fill="#25211D"/><text x="380" y="188" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="11" fill="#7C6D5C" text-anchor="middle" letter-spacing="2">通则：无 不 答 拜</text><line x1="250" y1="222" x2="250" y2="250" stroke="#994433" stroke-width="1.4"/><line x1="236" y1="250" x2="264" y2="250" stroke="#994433" stroke-width="1.4"/><text x="250" y="274" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="10" fill="#994433" text-anchor="middle" letter-spacing="0">吊丧</text><line x1="500" y1="222" x2="500" y2="250" stroke="#994433" stroke-width="1.4"/><line x1="486" y1="250" x2="514" y2="250" stroke="#994433" stroke-width="1.4"/><text x="500" y="274" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="10" fill="#994433" text-anchor="middle" letter-spacing="0">见君</text><text x="250" y="300" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9.5" fill="#7C6D5C" text-anchor="middle" letter-spacing="0">宾不答拜</text><text x="500" y="300" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9.5" fill="#7C6D5C" text-anchor="middle" letter-spacing="0">君不答士</text><text x="380" y="342" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="11" fill="#7C6D5C" text-anchor="middle" letter-spacing="0">礼尚往来</text><text x="380" y="366" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9.5" fill="#9A9186" text-anchor="middle" letter-spacing="0">例外不是疏漏，是各安其分</text><line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.8" stroke-dasharray="3,3"/><text x="70" y="470" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="13" fill="#25211D" text-anchor="start" letter-spacing="0">拜必答，除出两条。</text><text x="700" y="486" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="11" fill="#25211D" text-anchor="middle" letter-spacing="0">图二 · 往来</text></svg>