<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">赐与职供：分与恩</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<line x1="200" y1="132" x2="560" y2="132" stroke="#7C6D5C" stroke-width="1.2"/>
<line x1="300" y1="132" x2="300" y2="156" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="4,3"/>
<line x1="460" y1="132" x2="460" y2="156" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="4,3"/>
<path d="M300,156 L460,156 L446,196 L314,196 Z" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.2"/>
<line x1="320" y1="196" x2="320" y2="210" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<line x1="440" y1="196" x2="440" y2="210" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="180" font-size="14" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">帟</text>
<text x="380" y="224" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">幕之小者，承尘</text>
<rect x="165" y="260" width="195" height="96" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.1"/>
<text x="262" y="286" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">大夫以上</text>
<text x="262" y="310" font-size="11" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">幕人职供</text>
<text x="262" y="332" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">分也，应当有</text>
<rect x="395" y="260" width="195" height="96" fill="#F7F4EE" stroke="#994433" stroke-width="1.2"/>
<text x="492" y="286" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">士</text>
<text x="492" y="310" font-size="11" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">唯君赐乃有</text>
<text x="492" y="332" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">恩也，偶然有</text>
<text x="380" y="386" font-size="11" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">士所得的不是一顶幕，是「君还记得你」</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">制之尽处，恩之起处</text>
</svg>