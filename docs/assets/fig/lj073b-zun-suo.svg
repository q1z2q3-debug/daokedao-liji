<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">拜在何处：敬以位移示</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="70.0" y="140.0" width="180.0" height="140.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="160.0" y="176.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">己席</text>
  <text x="160.0" y="206.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">坐饮之位</text>
  <rect x="510.0" y="140.0" width="180.0" height="140.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="600.0" y="176.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">尊所</text>
  <text x="600.0" y="206.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">酒之所出</text>
  <line x1="254.0" y1="180.0" x2="506.0" y2="180.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="499.5" y1="177.4" x2="506.0" y2="180.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="499.5" y1="182.6" x2="506.0" y2="180.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <text x="380.0" y="170.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">酒进则起 → 往尊所</text>
  <line x1="506.0" y1="220.0" x2="254.0" y2="220.0" stroke="#DCD5C8" stroke-width="1.0"/>
  <line x1="260.5" y1="222.6" x2="254.0" y2="220.0" stroke="#DCD5C8" stroke-width="1.0"/>
  <line x1="260.5" y1="217.4" x2="254.0" y2="220.0" stroke="#DCD5C8" stroke-width="1.0"/>
  <text x="380.0" y="240.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">降席而拜，拜毕反席</text>
  <text x="160.0" y="254.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">起者，不敢当</text>
  <text x="600.0" y="254.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">乡尊：所敬在长者</text>
  <text x="60.0" y="312.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">陈尊之所，贵贱不同：诸侯在东楹西，卿大夫在房户间。</text>
  <text x="60.0" y="338.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#7C6D5C" letter-spacing="0.4">尊所非固定一角，是「酒之所陈」的当下之处。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　站对了地方，敬才成形。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 侍饮于长者</text>
</svg>