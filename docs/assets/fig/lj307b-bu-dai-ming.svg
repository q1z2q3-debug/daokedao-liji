<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">可以代其劳，不可代其名</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="110" y="146" width="170" height="74" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="195" y="176" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">父兄</text>
<text x="195" y="200" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">代命</text>
<line x1="284" y1="183" x2="456" y2="183" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="460" y="146" width="180" height="74" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="550" y="176" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">使者</text>
<text x="550" y="200" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">赴于有恩识者</text>
<rect x="300" y="300" width="170" height="60" fill="#F7F4EE" stroke="#994433" stroke-width="1.2"/>
<text x="385" y="336" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">犹称孝子名</text>
<line x1="385" y1="300" x2="385" y2="226" stroke="#DCD5C8" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="398" y="264" font-size="9" fill="#994433" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">名不代</text>
<text x="380" y="396" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">代的是差遣之劳，不是丧主之位</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">丧主之名是丧事成立的根本，名一易，丧就不是他的丧</text>
</svg>