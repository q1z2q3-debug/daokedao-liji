<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">一人之不忍，先王已纳之</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<line x1="120" y1="200" x2="660" y2="200" stroke="#DCD5C8" stroke-width="0.8"/>
<line x1="120" y1="360" x2="660" y2="360" stroke="#DCD5C8" stroke-width="0.8"/>
<line x1="330" y1="150" x2="330" y2="400" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="330" y="140" font-size="9.5" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">可以除之之期</text>
<rect x="456" y="178" width="96" height="34" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.2"/>
<text x="504" y="200" font-size="10.5" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">子路</text>
<line x1="452" y1="195" x2="344" y2="195" stroke="#7C6D5C" stroke-width="1.0" marker-end="url(#ah)"/>
<text x="400" y="186" font-size="9.5" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">闻之遂除</text>
<text x="504" y="226" font-size="9.5" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">可除而弗除</text>
<rect x="282" y="338" width="96" height="34" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.2"/>
<text x="330" y="360" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">既除</text>
<text x="504" y="350" font-size="9.5" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">吾寡兄弟而弗忍</text>
<text x="504" y="372" font-size="9.5" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">先王制礼，行道之人皆弗忍</text>
<text x="150" y="350" font-size="9" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">期已满</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">礼所定之期，正为不忍者而设</text>
</svg>