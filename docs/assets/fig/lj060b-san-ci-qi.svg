<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">一起一辞：礼在往复</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="80.0" y="150.0" width="190.0" height="90.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="175.0" y="196.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">客席</text>
  <rect x="490.0" y="150.0" width="190.0" height="90.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="585.0" y="196.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">主席</text>
  <line x1="150.0" y1="146.0" x2="150.0" y2="104.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="147.4" y1="110.5" x2="150.0" y2="104.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="152.6" y1="110.5" x2="150.0" y2="104.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <text x="150.0" y="96.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">①客执食兴，辞</text>
  <line x1="610.0" y1="146.0" x2="610.0" y2="104.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="607.4" y1="110.5" x2="610.0" y2="104.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="612.6" y1="110.5" x2="610.0" y2="104.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <text x="610.0" y="96.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">②主人兴，辞于客</text>
  <line x1="230.0" y1="146.0" x2="230.0" y2="116.0" stroke="#DCD5C8" stroke-width="1.0"/>
  <line x1="227.4" y1="122.5" x2="230.0" y2="116.0" stroke="#DCD5C8" stroke-width="1.0"/>
  <line x1="232.6" y1="122.5" x2="230.0" y2="116.0" stroke="#DCD5C8" stroke-width="1.0"/>
  <text x="232.0" y="110.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">③客复坐</text>
  <text x="380.0" y="196.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.5" fill="#7C6D5C" letter-spacing="0.4">「若欲食于堂下然」</text>
  <text x="380.0" y="216.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">譬况，非真降堂</text>
  <text x="60.0" y="286.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">降等：大夫为卿之客，品等卑下。</text>
  <text x="60.0" y="308.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">执食：所执者饭，饭为食主——辞的凭据。</text>
  <text x="60.0" y="330.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">敌客以上，无降法：此礼限于降等之客。</text>
  <text x="60.0" y="362.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="10.0" fill="#25211D" letter-spacing="0.4">一辞一辞，两起两坐；主人不兴，客将无所措。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　让与止，各守其分：礼在此处是活的。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 客若降等</text>
</svg>