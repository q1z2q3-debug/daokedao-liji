<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#7C6D5C"/></marker></defs><rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.8"/><rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.5"/><text x="380" y="52" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="15" fill="#25211D" text-anchor="middle" letter-spacing="3">人可走，器寄下</text><line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.2"/><line x1="320" y1="112" x2="320" y2="404" stroke="#994433" stroke-width="1.4"/><text x="320" y="104" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="11" fill="#994433" text-anchor="middle" letter-spacing="0">竟</text><line x1="120" y1="286" x2="120" y2="214" stroke="#7C6D5C" stroke-width="1"/><line x1="120" y1="214" x2="186" y2="214" stroke="#7C6D5C" stroke-width="1"/><line x1="186" y1="214" x2="186" y2="286" stroke="#7C6D5C" stroke-width="1"/><path d="M108 214 L153 180 L198 214" stroke="#7C6D5C" stroke-width="1.1" fill="none"/><line x1="104" y1="286" x2="202" y2="286" stroke="#7C6D5C" stroke-width="1.1"/><path d="M131 236 L175 236 L167 262 L139 262 Z" stroke="#7C6D5C" stroke-width="1.0" fill="none"/><line x1="139" y1="262" x2="138.3" y2="276" stroke="#7C6D5C" stroke-width="0.9"/><line x1="153" y1="262" x2="153" y2="276" stroke="#7C6D5C" stroke-width="0.9"/><line x1="167" y1="262" x2="167.7" y2="276" stroke="#7C6D5C" stroke-width="0.9"/><line x1="133" y1="276" x2="173" y2="276" stroke="#7C6D5C" stroke-width="0.9"/><rect x="214" y="238" width="86" height="40" fill="#F7F4EE" stroke="#9A9186" stroke-width="0.8"/><text x="257" y="264" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9.5" fill="#7C6D5C" text-anchor="middle" letter-spacing="0">同类之家</text><path d="M182 254 L212 254" stroke="#7C6D5C" stroke-width="1" fill="none" marker-end="url(#ah)"/><circle cx="420" cy="250" r="8" fill="none" stroke="#9A9186" stroke-width="1"/><path d="M400 261 L440 261 L434 308 L406 308 Z" stroke="#9A9186" stroke-width="1" fill="none"/><line x1="410" y1="308" x2="404" y2="332" stroke="#9A9186" stroke-width="1"/><line x1="430" y1="308" x2="436" y2="332" stroke="#9A9186" stroke-width="1"/><rect x="438" y="296" width="18" height="18" fill="#F7F4EE" stroke="#994433" stroke-width="1"/><text x="466" y="310" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="10" fill="#994433" text-anchor="start" letter-spacing="0">空手</text><text x="424" y="372" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="10" fill="#7C6D5C" text-anchor="middle" letter-spacing="0">去国</text><text x="257" y="312" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9.5" fill="#7C6D5C" text-anchor="middle" letter-spacing="0">寄者，觊己后还</text><text x="380" y="404" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="10" fill="#7C6D5C" text-anchor="middle" letter-spacing="0">用君禄所作，取以出竟，恐辱亲</text><line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.8" stroke-dasharray="3,3"/><text x="70" y="470" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="13" fill="#25211D" text-anchor="start" letter-spacing="0">器不出境，寄中有望。</text><text x="700" y="486" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="11" fill="#25211D" text-anchor="middle" letter-spacing="0">图二 · 寄器</text></svg>