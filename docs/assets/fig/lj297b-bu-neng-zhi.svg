<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">哀有不能至，礼不立于彼处</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<line x1="250" y1="110" x2="250" y2="384" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="236" y="114" font-size="10" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">至</text>
<text x="236" y="400" font-size="10" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">不至</text>
<circle cx="250" cy="154" r="4" fill="#25211D"/>
<text x="272" y="150" font-size="12" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">亲丧</text>
<text x="272" y="170" font-size="9" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">哀可至，礼以节之</text>
<circle cx="250" cy="316" r="4" fill="#9A9186"/>
<text x="272" y="312" font-size="12" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">君之母与妻</text>
<text x="272" y="332" font-size="9" fill="#994433" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">恻隐不能至</text>
<line x1="196" y1="342" x2="320" y2="342" stroke="#994433" stroke-width="1.2"/>
<text x="196" y="364" font-size="10" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">礼不在此处立仪</text>
<rect x="420" y="250" width="240" height="130" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="540" y="276" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">居处</text>
<text x="540" y="306" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">言语</text>
<text x="540" y="336" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">饮食</text>
<text x="540" y="362" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">皆衎尔</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">人心有到不了的地方，礼就不把仪文立在那处</text>
</svg>