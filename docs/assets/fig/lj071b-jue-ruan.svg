<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">软者齿决，坚者手擘，炙者先哜</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="60.0" y="112.0" width="180.0" height="134.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="150.0" y="146.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">濡肉</text>
  <path d="M110 178 q40 -14 80 0 q-40 16 -80 0" fill="none" stroke="#7C6D5C" stroke-width="1.2"/>
  <text x="150.0" y="222.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">齿决｜湿软不可擘</text>
  <rect x="290.0" y="112.0" width="180.0" height="134.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="380.0" y="146.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">乾肉</text>
  <rect x="320.0" y="170.0" width="120.0" height="18.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="380.0" y="184.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">条状干硬</text>
  <text x="380.0" y="222.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">手擘｜坚不宜齿</text>
  <rect x="520.0" y="112.0" width="180.0" height="134.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="610.0" y="146.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">炙</text>
  <line x1="560.0" y1="186.0" x2="660.0" y2="186.0" stroke="#7C6D5C" stroke-width="1.4"/>
  <circle cx="580.0" cy="186.0" r="3.0" fill="#994433"/>
  <circle cx="610.0" cy="186.0" r="3.0" fill="#994433"/>
  <circle cx="640.0" cy="186.0" r="3.0" fill="#994433"/>
  <text x="610.0" y="222.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">先哜而后反于俎</text>
  <text x="60.0" y="282.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">一口吞尽曰「嘬」：不细啮，是一举尽脔。</text>
  <text x="60.0" y="308.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">器异则礼异：共器不可反，己俎可反。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　看物之性再动手：仪从物来，不从人来。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 濡肉齿决</text>
</svg>