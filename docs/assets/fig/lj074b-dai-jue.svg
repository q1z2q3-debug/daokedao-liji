<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">让的两段：先让动作，再让次序</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="60.0" y="100.0" width="180.0" height="104.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="150.0" y="130.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">长者辞</text>
  <text x="150.0" y="188.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">止少者之起</text>
  <rect x="290.0" y="100.0" width="180.0" height="104.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="380.0" y="130.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">少者反席</text>
  <text x="380.0" y="188.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">敬已达则还位</text>
  <rect x="560.0" y="100.0" width="140.0" height="104.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="630.0" y="130.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">举未釂</text>
  <text x="630.0" y="188.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">尽爵曰釂</text>
  <line x1="244.0" y1="152.0" x2="286.0" y2="152.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="279.5" y1="149.4" x2="286.0" y2="152.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="279.5" y1="154.6" x2="286.0" y2="152.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="474.0" y1="152.0" x2="556.0" y2="152.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="549.5" y1="149.4" x2="556.0" y2="152.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="549.5" y1="154.6" x2="556.0" y2="152.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="380.0" y="236.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.0" fill="#7C6D5C" letter-spacing="0.4">还了席，不等于可以饮</text>
  <rect x="250.0" y="256.0" width="260.0" height="76.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="380.0" y="286.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">待釂而后饮</text>
  <text x="380.0" y="316.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">不敢先尊者</text>
  <text x="60.0" y="376.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">注：不敢先尊者｜疏：尊卑异爵，公执膳爵，受赐者执散爵</text>
  <text x="60.0" y="400.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">疏又辨：此据燕饮正礼；《士相见》《玉藻》先君卒爵而俟，乃私燕之礼</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　敬而能受命，受命而不失敬。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 长者辞</text>
</svg>