<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">祭与不祭：看所食者是谁之余</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="80.0" y="100.0" width="290.0" height="150.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="225.0" y="126.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">食尊者之余</text>
  <text x="225.0" y="156.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">君、亲之赐</text>
  <text x="225.0" y="196.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="14.0" fill="#994433" letter-spacing="0.4">祭</text>
  <text x="225.0" y="226.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">以尊者之赐转敬于先</text>
  <rect x="390.0" y="100.0" width="290.0" height="150.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="535.0" y="126.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">食卑者之余</text>
  <text x="535.0" y="156.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">父得子余／夫得妻余</text>
  <text x="535.0" y="196.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="14.0" fill="#994433" letter-spacing="0.4">不祭</text>
  <text x="535.0" y="226.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">以卑者之物献先，则序乱</text>
  <text x="60.0" y="286.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">注：「馂而不祭，唯此类也」——非一切馂皆不祭。</text>
  <text x="60.0" y="312.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">熊氏：父得子余，在年老致仕、传家之后；夫得妻余，在宗妇燕饮之余。</text>
  <text x="60.0" y="336.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">可见此礼有其情境，非泛设。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　宁阙其祭，不乱其序。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 馂余不祭</text>
</svg>