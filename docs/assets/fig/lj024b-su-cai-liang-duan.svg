<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="730" height="490" fill="#DCD5C8"/>
  <rect x="16" y="16" width="728" height="488" fill="#DCD5C8"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="17" fill="#25211D" letter-spacing="3">素与采：两端之让</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="0.8"/>
  <text x="86" y="110" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C" letter-spacing="1.5">冠衣之纯：纯，缘也</text>
  <rect x="70" y="128" width="160" height="44" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="150" y="158" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="15" fill="#25211D" letter-spacing="2">素</text>
  <rect x="230" y="128" width="220" height="44" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="340" y="158" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="15" fill="#25211D" letter-spacing="2">青</text>
  <rect x="450" y="128" width="240" height="44" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="570" y="158" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="15" fill="#25211D" letter-spacing="2">缋</text>
  <text x="150" y="192" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9.5" fill="#7C6D5C" letter-spacing="0.5">少而并无，乃纯素</text>
  <text x="340" y="192" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9.5" fill="#7C6D5C" letter-spacing="0.5">有父母，无太父母</text>
  <text x="570" y="192" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9.5" fill="#7C6D5C" letter-spacing="0.5">具父母、太父母存</text>
  <line x1="199" y1="143" x2="213" y2="157" stroke="#994433" stroke-width="1.4"/>
  <line x1="199" y1="157" x2="213" y2="143" stroke="#994433" stroke-width="1.4"/>
  <text x="150" y="212" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="0.5">父母存，不敢纯素</text>
  <line x1="60" y1="232" x2="700" y2="232" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="86" y="262" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C" letter-spacing="1.5">孤子当室：冠衣不纯采</text>
  <circle cx="96" cy="288" r="3" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.7"/>
  <text x="112" y="292" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10" fill="#25211D" letter-spacing="0.8">早丧亲，虽除丧，不忘哀</text>
  <circle cx="96" cy="322" r="3" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.7"/>
  <text x="112" y="326" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10" fill="#25211D" letter-spacing="0.8">年未三十；三十壮有室，有代亲之端，不为孤</text>
  <circle cx="96" cy="356" r="3" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.7"/>
  <text x="112" y="360" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10" fill="#25211D" letter-spacing="0.8">当室，適子也</text>
  <circle cx="96" cy="390" r="3" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.7"/>
  <text x="112" y="394" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10" fill="#25211D" letter-spacing="0.8">《深衣》：孤子衣纯以素</text>
  <rect x="600" y="282" width="64" height="64" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="632" y="322" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="14" fill="#7C6D5C" letter-spacing="1">采</text>
  <line x1="622" y1="304" x2="642" y2="324" stroke="#994433" stroke-width="1.4"/>
  <line x1="622" y1="324" x2="642" y2="304" stroke="#994433" stroke-width="1.4"/>
  <text x="632" y="368" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0.5">哀在，不许其采</text>
  <line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="1"/>
  <text x="380" y="468" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D" letter-spacing="2">素非丧而亲在不敢，采非吉而哀在不敢</text>
  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186" letter-spacing="1">图二 · 素与采：两端之让 · lj024b</text>
</svg>
