<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">由内而外：主、次、末、饮</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="200.0" y="124.0" width="360.0" height="124.0" fill="none" stroke="#7C6D5C" stroke-width="0.7" stroke-dasharray="3,3"/>
  <text x="380.0" y="116.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.5" fill="#7C6D5C" letter-spacing="0.4">脍炙　处外，肉之精</text>
  <rect x="250.0" y="150.0" width="260.0" height="72.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="380.0" y="182.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#25211D" letter-spacing="0.4">醯酱</text>
  <text x="380.0" y="202.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">食之主，最近人</text>
  <rect x="120.0" y="132.0" width="60.0" height="44.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="150.0" y="152.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">葱</text>
  <text x="150.0" y="168.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">末</text>
  <text x="120.0" y="200.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">殊加，不夺正</text>
  <rect x="590.0" y="132.0" width="90.0" height="52.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="635.0" y="152.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">酒浆</text>
  <text x="635.0" y="172.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">处右</text>
  <text x="590.0" y="204.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">两有则左酒右浆</text>
  <line x1="300.0" y1="240.0" x2="238.0" y2="272.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="245.0" y1="271.3" x2="238.0" y2="272.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="242.6" y1="266.7" x2="238.0" y2="272.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="196.0" y="296.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">内 → 外</text>
  <text x="60.0" y="326.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="10.0" fill="#25211D" letter-spacing="0.4">一席之陈：主在内，从在外，加在末，饮在最后。</text>
  <text x="60.0" y="350.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">《公食大夫礼》：设酒于豆东，浆饮于稻西。</text>
  <text x="60.0" y="374.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">葱非正馔，故礼给其位而不给其正。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　秩序不是禁令，是把每一物的本分放对地方。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 脍炙处外</text>
</svg>