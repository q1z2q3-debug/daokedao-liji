<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">复于六处：求之愈备，愈知其不返</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<line x1="120" y1="250" x2="646" y2="250" stroke="#7C6D5C" stroke-width="1.0"/>
<circle cx="148" cy="250" r="4" fill="#25211D"/>
<text x="148" y="282" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">小寝</text>
<circle cx="248" cy="250" r="4" fill="#25211D"/>
<text x="248" y="282" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">大寝</text>
<circle cx="348" cy="250" r="4" fill="#25211D"/>
<text x="348" y="282" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">小祖</text>
<circle cx="438" cy="250" r="4" fill="#25211D"/>
<text x="438" y="282" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">大祖</text>
<circle cx="528" cy="250" r="4" fill="#25211D"/>
<text x="528" y="282" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">库门</text>
<circle cx="612" cy="250" r="4" fill="#25211D"/>
<text x="612" y="282" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">四郊</text>
<line x1="612" y1="250" x2="660" y2="250" stroke="#DCD5C8" stroke-width="1.0" stroke-dasharray="4,4"/>
<circle cx="670" cy="250" r="8" fill="none" stroke="#994433" stroke-width="1.2"/>
<text x="670" y="288" font-size="9" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">不返</text>
<text x="380" y="330" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">六处皆其平生所至：寝、庙、门、郊</text>
<text x="380" y="356" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">招完一处，转向下一处——六次落空</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">这不是重复，是搜索：有对象的搜索是备，无对象的重复是赘</text>
</svg>