<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">三时之服，随主人之变</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="88" y="150" width="178" height="170" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="177" y="184" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">始死</text>
<text x="177" y="214" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">朝服·裼裘</text>
<text x="177" y="242" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">如吉时</text>
<rect x="290" y="150" width="178" height="170" fill="#F7F4EE" stroke="#994433" stroke-width="1.2"/>
<text x="379" y="184" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">小敛后</text>
<text x="379" y="214" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">袭裘加武带绖</text>
<text x="379" y="242" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">主人已变</text>
<rect x="492" y="150" width="178" height="170" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="581" y="184" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">成服后</text>
<text x="581" y="214" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">锡衰·疑衰</text>
<text x="581" y="242" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">弁绖当事</text>
<line x1="268" y1="236" x2="288" y2="236" stroke="#7C6D5C" stroke-width="1.0" marker-end="url(#ah)"/>
<line x1="470" y1="236" x2="490" y2="236" stroke="#7C6D5C" stroke-width="1.0" marker-end="url(#ah)"/>
<text x="380" y="352" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">主人未变则不改，主人既变则即变</text>
<text x="380" y="384" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">裼者见美，袭者不尽饰</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">吊服随主人，不随吊者</text>
</svg>