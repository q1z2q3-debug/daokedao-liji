<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">殷不降，周降</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<text x="200" y="148" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">殷：上下各以其亲</text>
<line x1="90" y1="180" x2="310" y2="180" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="90" y="170" width="220" height="20" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="90" y1="230" x2="310" y2="230" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="90" y="220" width="220" height="20" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="80" y="176" font-size="10" fill="#25211D" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">上</text>
<text x="80" y="226" font-size="10" fill="#25211D" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">下</text>
<line x1="380" y1="120" x2="380" y2="300" stroke="#DCD5C8" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="560" y="148" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">周：以尊降</text>
<rect x="430" y="170" width="220" height="20" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="430" y="220" width="150" height="20" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="588" y="234" font-size="10" fill="#994433" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">降</text>
<line x1="580" y1="220" x2="580" y2="240" stroke="#994433" stroke-width="1.2"/>
<text x="420" y="176" font-size="10" fill="#25211D" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">上</text>
<text x="420" y="226" font-size="10" fill="#25211D" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">下</text>
<text x="380" y="330" font-size="11" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">唯不降正：正尊不动，所降者旁亲</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">降是周人的发明，不降是殷的旧法</text>
</svg>