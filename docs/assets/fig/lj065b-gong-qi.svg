<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">共器二戒：不争饱，不秽人</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <ellipse cx="380" cy="212" rx="150" ry="52" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <ellipse cx="380" cy="202" rx="150" ry="52" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380.0" y="208.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">共羹饭之大器</text>
  <text x="380.0" y="230.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">同器而食，非礼食</text>
  <text x="60.0" y="140.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">不争饱</text>
  <text x="60.0" y="162.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">谦也：不厌饫</text>
  <text x="60.0" y="192.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">取到餍足，则他人不足</text>
  <text x="700.0" y="140.0" text-anchor="end" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">手不泽</text>
  <text x="700.0" y="162.0" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">临食搓手则秽人</text>
  <text x="700.0" y="192.0" text-anchor="end" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">饭以手，故手须洁</text>
  <line x1="150.0" y1="212.0" x2="222.0" y2="212.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="215.5" y1="209.4" x2="222.0" y2="212.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="215.5" y1="214.6" x2="222.0" y2="212.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="610.0" y1="212.0" x2="538.0" y2="212.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="544.5" y1="214.6" x2="538.0" y2="212.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="544.5" y1="209.4" x2="538.0" y2="212.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="60.0" y="312.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">此两条以「共器」为前提；分器而食，则皆不必。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　一谦一洁：不以便己妨人。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 共食不饱</text>
</svg>