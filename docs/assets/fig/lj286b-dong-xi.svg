<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">东方为礼，西方为末失</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<line x1="90" y1="300" x2="690" y2="300" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="360" y="258" width="44" height="44" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="382" y="286" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">尸</text>
<rect x="210" y="250" width="80" height="60" fill="#F7F4EE" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="250" y="276" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">奠</text>
<text x="250" y="232" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">东：无席</text>
<rect x="460" y="250" width="80" height="60" fill="#F7F4EE" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="500" y="276" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">奠</text>
<line x1="452" y1="310" x2="548" y2="310" stroke="#994433" stroke-width="1.2"/>
<text x="500" y="232" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">西：有席</text>
<text x="500" y="344" font-size="10" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">鲁礼之末失</text>
<text x="380" y="384" font-size="11" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">《士丧礼》：小敛之奠，设于尸东</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">当时这样做，不等于礼当这样</text>
</svg>