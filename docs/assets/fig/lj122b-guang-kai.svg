<text x="180" y="180" font-family="Noto Serif CJK SC" font-size="12" fill="#25211D" text-anchor="start">不广欬</text>
<text x="180" y="200" font-family="Noto Serif CJK SC" font-size="10" fill="#9A9186" text-anchor="start">声大似自矜</text>
