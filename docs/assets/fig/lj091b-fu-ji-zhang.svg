<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">敬、便、防：三种用心，同一双手</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="60.0" y="108.0" width="190.0" height="110.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="155.0" y="138.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">拂几杖</text>
  <text x="155.0" y="202.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">敬其所凭倚</text>
  <rect x="290.0" y="108.0" width="190.0" height="110.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="385.0" y="138.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">右牵马羊</text>
  <text x="385.0" y="202.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">右手为力手</text>
  <rect x="520.0" y="108.0" width="190.0" height="110.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="615.0" y="138.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">左牵犬</text>
  <text x="615.0" y="202.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">右手备其啮</text>
  <text x="155.0" y="260.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#994433" letter-spacing="0.4">敬</text>
  <text x="385.0" y="260.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#994433" letter-spacing="0.4">便</text>
  <text x="615.0" y="260.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#994433" letter-spacing="0.4">防</text>
  <text x="60.0" y="300.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="8.8" fill="#7C6D5C" letter-spacing="0.4">疏辨：《少仪》献犬右牵，彼田犬、畜犬不啮人；此充食之犬，故左牵而右手防御。</text>
  <text x="60.0" y="326.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">犬狗之别：大者为犬，小者为狗；《尔雅》「未成毫狗」。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　礼不违物性：先取其便，再备其患。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 进几杖者拂之</text>
</svg>