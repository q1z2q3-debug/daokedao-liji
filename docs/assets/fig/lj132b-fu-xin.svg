<text x="375" y="372" font-size="9.5" fill="#9A9186" text-anchor="middle">檐樵之馀劳，不堪射</text>
<text x="380" y="108" font-size="10" fill="#7C6D5C" text-anchor="middle">射者所以观德，唯有疾可以辞</text>
