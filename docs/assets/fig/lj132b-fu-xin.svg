<text x="120" y="162" font-size="9.5" fill="#9A9186" text-anchor="start">直云不能，则似素餐，且辱君不知人</text><line x1="70" y1="444" x2="690" y2="444" stroke="#DCD5C8" stroke-width="1.0"/><text x="70" y="468" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="13" fill="#994433">结论　说病不说不能，是给自己留体面，也给君留体面</text><text x="690" y="486" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="11" fill="#9A9186" text-anchor="end">图二 · 不能则辞以疾</text></svg>