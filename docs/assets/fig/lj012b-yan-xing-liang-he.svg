  <text x="380" y="372" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="15" fill="#25211D" letter-spacing="2">文可增損　本不可無</text>
  <text x="380" y="402" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#994433" letter-spacing="1">忠信之人可以學禮</text>
  <text x="380" y="430" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C" letter-spacing="1">行修言道，是入門；中正無邪，是成驗</text>
  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186">图二 · 修身践言　行修言道 · lj012b</text>
