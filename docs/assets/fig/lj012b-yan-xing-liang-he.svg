  <text x="380" y="278" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="17" fill="#25211D">質</text>
  <text x="380" y="298" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">本也</text>
  <line x1="380" y1="178" x2="380" y2="252" stroke="#994433" stroke-width="0.9"/>
  <text x="410" y="222" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C" letter-spacing="1">立</text>
