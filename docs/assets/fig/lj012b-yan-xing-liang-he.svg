  <rect x="510" y="116" width="160" height="74" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="590" y="151" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="15" fill="#25211D">行</text>
  <text x="590" y="171" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">修於身</text>
  <rect x="330" y="128" width="100" height="50" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="380" y="151" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="16" fill="#25211D">合</text>
