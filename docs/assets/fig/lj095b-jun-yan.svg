<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">急与敬：君命不可宿</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="60.0" y="112.0" width="100.0" height="96.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="110.0" y="142.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">受命</text>
  <text x="110.0" y="192.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">君有所问</text>
  <line x1="162.0" y1="160.0" x2="170.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <line x1="163.5" y1="157.4" x2="170.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <line x1="163.5" y1="162.6" x2="170.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <rect x="170.0" y="112.0" width="100.0" height="96.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="220.0" y="142.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">即行</text>
  <text x="220.0" y="192.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">不宿于家</text>
  <line x1="272.0" y1="160.0" x2="280.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <line x1="273.5" y1="157.4" x2="280.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <line x1="273.5" y1="162.6" x2="280.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <rect x="280.0" y="112.0" width="100.0" height="96.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="330.0" y="142.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">言至</text>
  <text x="330.0" y="192.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">出门拜受</text>
  <line x1="382.0" y1="160.0" x2="390.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <line x1="383.5" y1="157.4" x2="390.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <line x1="383.5" y1="162.6" x2="390.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <rect x="390.0" y="112.0" width="100.0" height="96.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="440.0" y="142.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">使归</text>
  <text x="440.0" y="192.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">拜送门外</text>
  <line x1="492.0" y1="160.0" x2="500.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <line x1="493.5" y1="157.4" x2="500.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <line x1="493.5" y1="162.6" x2="500.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <rect x="500.0" y="112.0" width="100.0" height="96.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="550.0" y="142.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">告君</text>
  <text x="550.0" y="192.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">朝服命使</text>
  <line x1="602.0" y1="160.0" x2="610.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <line x1="603.5" y1="157.4" x2="610.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <line x1="603.5" y1="162.6" x2="610.0" y2="160.0" stroke="#7C6D5C" stroke-width="0.9"/>
  <rect x="610.0" y="112.0" width="100.0" height="96.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="660.0" y="142.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">使反</text>
  <text x="660.0" y="192.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">下堂受命</text>
  <text x="60.0" y="248.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.2" fill="#25211D" letter-spacing="0.4">上半：君言来，主人迎送皆出门（疏：去既送出门，知初至亦出门）</text>
  <text x="60.0" y="274.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">下半：己遣使告君，朝服而命；使返则下堂受命——去不下送，反而下迎，尊君命也</text>
  <text x="60.0" y="300.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.2" fill="#7C6D5C" letter-spacing="0.4">注引《聘礼》「君有言，则以束帛如飨礼」：言不可空传，必有物将之。</text>
  <text x="60.0" y="330.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">唯此一句最硬：君言在身，家便不是可留之地。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　敬的是命，不是人；急的是命，不是己。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 凡为君使者</text>
</svg>