<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">一枚果核的去处：弃之如弃君赐</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="70.0" y="116.0" width="140.0" height="92.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="140.0" y="148.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">受果</text>
  <text x="140.0" y="176.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">君前受赐</text>
  <line x1="214.0" y1="162.0" x2="236.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="229.5" y1="159.4" x2="236.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="229.5" y1="164.6" x2="236.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <rect x="236.0" y="116.0" width="140.0" height="92.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="306.0" y="148.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">食果</text>
  <text x="306.0" y="176.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">食其余</text>
  <line x1="380.0" y1="162.0" x2="402.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="395.5" y1="159.4" x2="402.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="395.5" y1="164.6" x2="402.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <rect x="402.0" y="116.0" width="140.0" height="92.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="472.0" y="148.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">存核</text>
  <text x="472.0" y="176.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">核为君物之余</text>
  <line x1="546.0" y1="162.0" x2="568.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="561.5" y1="159.4" x2="568.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="561.5" y1="164.6" x2="568.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <rect x="568.0" y="116.0" width="140.0" height="92.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="638.0" y="148.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">怀之</text>
  <text x="638.0" y="176.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">贴身收藏</text>
  <line x1="70.0" y1="246.0" x2="700.0" y2="246.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="150.0" y="286.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">弃于君前</text>
  <line x1="88.0" y1="274.0" x2="104.0" y2="290.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="104.0" y1="274.0" x2="88.0" y2="290.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <text x="150.0" y="312.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">形迹上像轻慢</text>
  <text x="560.0" y="286.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">藏而不显</text>
  <text x="560.0" y="312.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">敬不必扬</text>
  <text x="60.0" y="352.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">注曰「嫌」：礼防的是可见之嫌，不是心迹之实。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　轻于鸿毛之物，才见无人处的分寸。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 赐果于君前</text>
</svg>