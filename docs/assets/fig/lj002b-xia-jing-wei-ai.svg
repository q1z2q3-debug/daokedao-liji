<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="730" height="490" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="17" fill="#25211D" letter-spacing="3">狎而敬之　畏而愛之</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="0.8"/>
  <rect x="110" y="100" width="150" height="72" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="185" y="134" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="15" fill="#25211D">狎</text>
  <text x="185" y="154" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">近之，習其行</text>
  <rect x="500" y="100" width="150" height="72" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="575" y="134" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="15" fill="#25211D">畏</text>
  <text x="575" y="154" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">心服曰畏</text>
  <rect x="110" y="250" width="150" height="72" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="185" y="284" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="15" fill="#25211D">敬</text>
  <text x="185" y="304" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">不因近而慢</text>
  <rect x="500" y="250" width="150" height="72" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="575" y="284" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="15" fill="#25211D">愛</text>
  <text x="575" y="304" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">不因服而疏</text>
  <line x1="185" y1="172" x2="185" y2="250" stroke="#994433" stroke-width="0.9"/>
  <line x1="575" y1="172" x2="575" y2="250" stroke="#994433" stroke-width="0.9"/>
  <rect x="300" y="132" width="160" height="26" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="380" y="143" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="#25211D">敬而遠之：冷</text>
  <rect x="300" y="196" width="160" height="26" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="380" y="207" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="#25211D">熟而生慢：薄</text>
  <text x="380" y="120" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C" letter-spacing="2">兩病卡在中間</text>
  <line x1="52" y1="360" x2="708" y2="360" stroke="#994433" stroke-width="0.9"/>
  <text x="380" y="400" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="15" fill="#25211D" letter-spacing="2">敬不生距離　愛不生輕慢</text>
  <text x="380" y="428" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C" letter-spacing="1">鄭注：狎，習也，近也　｜　心服曰畏</text>
  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186">图二 · 贤者狎而敬之 · lj002b</text>
</svg>
