<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="730" height="490" fill="#DCD5C8"/>
  <rect x="16" y="16" width="728" height="488" fill="#DCD5C8"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="17" fill="#25211D" letter-spacing="3">贴与起：一坐三起</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="0.8"/>
  <rect x="60" y="120" width="300" height="62" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="210" y="158" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#25211D" letter-spacing="1">尊者之席</text>
  <rect x="60" y="182" width="300" height="62" fill="#F7F4EE" stroke="#994433" stroke-width="1"/>
  <text x="210" y="220" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10" fill="#25211D" letter-spacing="0.8">己席：尽近尊者之端</text>
  <line x1="60" y1="182" x2="360" y2="182" stroke="#994433" stroke-width="1.6"/>
  <text x="370" y="178" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="0.4">← 无余席</text>
  <line x1="60" y1="244" x2="360" y2="244" stroke="#DCD5C8" stroke-width="0.8" stroke-dasharray="4 4"/>
  <text x="210" y="268" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0.3">下端留空，以待后来者</text>
  <rect x="60" y="286" width="300" height="50" fill="#F7F4EE" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="210" y="306" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">备拟先生顾问，不可过远（疏）</text>
  <text x="210" y="324" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">且阙其在下空处以待后人（疏）</text>
  <line x1="400" y1="120" x2="400" y2="340" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="540" y="146" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#994433" letter-spacing="1.5">三起</text>
  <rect x="430" y="180" width="80" height="40" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="470" y="206" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10" fill="#25211D" letter-spacing="0.6">烛至</text>
  <text x="524" y="206" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0.3">异昼夜</text>
  <rect x="430" y="236" width="80" height="40" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="470" y="262" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10" fill="#25211D" letter-spacing="0.6">食至</text>
  <text x="524" y="262" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0.3">为馔变</text>
  <rect x="430" y="292" width="80" height="40" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="470" y="318" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10" fill="#25211D" letter-spacing="0.6">上客至</text>
  <text x="524" y="318" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0.3">敬尊者</text>
  <text x="430" y="346" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="0.3">尊者不必起（疏）</text>
  <text x="430" y="366" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="0.3">见同等不起：不为私敬</text>
  <line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="1"/>
  <text x="380" y="468" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D" letter-spacing="2">贴着坐，数着起</text>
  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186" letter-spacing="1">图二 · 贴与起：一坐三起 · lj039b</text>
</svg>
