<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">什么场合，脸上该是什么样子</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="60.0" y="110.0" width="156.0" height="120.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="138.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#994433" letter-spacing="0.4">声</text>
  <text x="138.0" y="182.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.3" fill="#25211D" letter-spacing="0.4">不歌｜不相｜不叹</text>
  <rect x="224.0" y="110.0" width="156.0" height="120.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="302.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#994433" letter-spacing="0.4">容</text>
  <text x="302.0" y="182.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.3" fill="#25211D" letter-spacing="0.4">不翔｜不笑｜不登垄</text>
  <rect x="388.0" y="110.0" width="156.0" height="120.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="466.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#994433" letter-spacing="0.4">行</text>
  <text x="466.0" y="182.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.3" fill="#25211D" letter-spacing="0.4">不由径｜不避涂潦</text>
  <rect x="552.0" y="110.0" width="156.0" height="120.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="630.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#994433" letter-spacing="0.4">色</text>
  <text x="630.0" y="182.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.3" fill="#25211D" letter-spacing="0.4">哀色｜不可犯之色</text>
  <text x="60.0" y="270.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">注：「貌与事宜相配」——礼把表情当作事的延伸。</text>
  <text x="60.0" y="296.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.2" fill="#7C6D5C" letter-spacing="0.4">末句最狠：色厉而内荏，貌恭心很，非情者也。</text>
  <text x="60.0" y="322.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.2" fill="#25211D" letter-spacing="0.4">故君子戒慎，不失色于人：不是不失态，是不使色与心两截。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　礼要的不是一副表情，是心色如一。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 适墓不登垄</text>
</svg>