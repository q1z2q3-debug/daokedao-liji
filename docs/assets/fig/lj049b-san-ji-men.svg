  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="19" fill="#25211D" letter-spacing="3">三级之门：席、名、币</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="60.0" y="130.0" width="150.0" height="180.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="135.0" y="160.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="12.0" fill="#25211D" letter-spacing="2.0">席</text>
  <rect x="90.0" y="180.0" width="90.0" height="26.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <rect x="82.0" y="224.0" width="90.0" height="26.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="135.0" y="272.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C">父子不同席</text>
  <text x="135.0" y="290.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.0" fill="#7C6D5C">异尊卑也</text>
  <rect x="300.0" y="130.0" width="150.0" height="180.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="375.0" y="160.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="12.0" fill="#25211D" letter-spacing="2.0">名</text>
  <rect x="320.0" y="186.0" width="110.0" height="18.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="375.0" y="200.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9.0" fill="#9A9186">姓名</text>
  <text x="375.0" y="240.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C">非有行媒，不相知</text>
  <text x="375.0" y="258.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.0" fill="#7C6D5C">六礼之二：问名</text>
  <rect x="540.0" y="130.0" width="150.0" height="180.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="615.0" y="160.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="12.0" fill="#25211D" letter-spacing="2.0">币</text>
  <rect x="575.0" y="190.0" width="80.0" height="46.0" fill="#F7F4EE" stroke="#994433" stroke-width="1.0"/>
  <line x1="585.0" y1="208.0" x2="645.0" y2="208.0" stroke="#994433" stroke-width="0.8"/>
  <line x1="585.0" y1="218.0" x2="645.0" y2="218.0" stroke="#994433" stroke-width="0.8"/>
  <text x="615.0" y="262.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C">玄纁束帛</text>
  <text x="615.0" y="280.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.0" fill="#7C6D5C">非受币不交不亲</text>
  <line x1="212.0" y1="220.0" x2="296.0" y2="220.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="296.0" y1="220.0" x2="290.7" y2="217.1" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="296.0" y1="220.0" x2="290.7" y2="222.9" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="452.0" y1="220.0" x2="536.0" y2="220.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="536.0" y1="220.0" x2="530.7" y2="217.1" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="536.0" y1="220.0" x2="530.7" y2="222.9" stroke="#7C6D5C" stroke-width="1.2"/>
  <text x="80.0" y="334.0" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.4">同处 → 知情 → 定约：每一级都有守门的人。</text>
  <text x="80.0" y="356.0" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.0" fill="#994433" letter-spacing="0.4">「缠固」：把松散的往来束成一处。</text>
  <text x="80.0" y="378.0" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">今日次序仍在：先知情，再承诺，再公开。</text>
  <line x1="60" y1="444" x2="700" y2="444" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="470" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="14" fill="#25211D" letter-spacing="2">一级一级走，不跳</text>
  <text x="700" y="492" text-anchor="end" font-family="Noto Serif SC,serif" font-size="10" fill="#9A9186">图二 · 三级之门：席、名、币 · lj049b</text>
