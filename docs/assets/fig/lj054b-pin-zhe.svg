  <text x="470.0" y="240.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">杖</text>
  <text x="548.0" y="274.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">杖与屦：借物代力，减仪存敬</text>
  <rect x="60.0" y="286.0" width="290.0" height="44.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="76.0" y="314.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="10.0" fill="#25211D" letter-spacing="0.4">礼许俭　许其减，不为标准</text>
  <rect x="370.0" y="286.0" width="330.0" height="44.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="386.0" y="314.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="10.0" fill="#25211D" letter-spacing="0.4">不非无　不责人以所无</text>
  <text x="60.0" y="364.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#7C6D5C" letter-spacing="0.4">所许者贫与老：两类，余可类推而不可滥。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　礼所要者，不在货财与筋力，在一分心、一分敬。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 贫者不以货财</text>
