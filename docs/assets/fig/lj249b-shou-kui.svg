<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">先受其礼，后食其馈</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="92" y="208" width="116" height="64" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="150" y="234" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">出</text>
<text x="150" y="256" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">受之</text>
<rect x="272" y="208" width="116" height="64" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="330" y="234" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">入</text>
<text x="330" y="256" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">弹琴</text>
<rect x="452" y="208" width="116" height="64" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="510" y="234" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">而</text>
<text x="510" y="256" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">后食之</text>
<line x1="216" y1="240" x2="264" y2="240" stroke="#7C6D5C" stroke-width="1.1" marker-end="url(#ah)"/>
<line x1="396" y1="240" x2="444" y2="240" stroke="#7C6D5C" stroke-width="1.1" marker-end="url(#ah)"/>
<text x="330" y="292" font-size="9.5" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">散哀</text>
<text x="380" y="366" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">哀得其散，馈得其受</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">受人之馈，不废己之哀</text>
</svg>