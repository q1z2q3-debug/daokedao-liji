<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">怎么拿，怎么裹</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="70.0" y="104.0" width="280.0" height="150.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="210.0" y="132.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.5" fill="#25211D" letter-spacing="0.4">执禽</text>
  <line x1="120.0" y1="178.0" x2="270.0" y2="178.0" stroke="#7C6D5C" stroke-width="3.0"/>
  <circle cx="120" cy="178" r="7" fill="#F7F4EE" stroke="#994433" stroke-width="1"/>
  <text x="112.0" y="206.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">左首</text>
  <text x="210.0" y="206.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">横捧而不竖提</text>
  <rect x="410.0" y="104.0" width="280.0" height="150.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="550.0" y="132.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.5" fill="#25211D" letter-spacing="0.4">饰羔雁</text>
  <rect x="470.0" y="166.0" width="160.0" height="44.0" fill="#7C6D5C" stroke="#F7F4EE" stroke-width="0.8"/>
  <path d="M486 188 q16 -10 32 0 q16 10 32 0 q16 -10 32 0 q16 10 32 0" fill="none" stroke="#9A9186" stroke-width="0.8"/>
  <text x="550.0" y="230.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">以缋覆之，画为云气</text>
  <text x="60.0" y="290.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.3" fill="#25211D" letter-spacing="0.4">疏：左，阳也，首亦阳也；并授则主人在左，客以鸟首授之。</text>
  <text x="60.0" y="316.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="8.8" fill="#7C6D5C" letter-spacing="0.4">诸侯之卿大夫饰以布，天子之卿大夫饰以画——礼之等藏在一层布上。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　朝向有讲究，包裹有等第。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 执禽者左首</text>
</svg>