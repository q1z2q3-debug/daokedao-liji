<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">私赠纳入公仪：有命，有容</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="70.0" y="104.0" width="150.0" height="96.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="145.0" y="134.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">弓剑</text>
  <text x="145.0" y="184.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">器</text>
  <rect x="240.0" y="104.0" width="150.0" height="96.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="315.0" y="134.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">苞苴</text>
  <text x="315.0" y="184.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">裹鱼肉</text>
  <rect x="410.0" y="104.0" width="150.0" height="96.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="485.0" y="134.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">箪笥</text>
  <text x="485.0" y="184.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">盛饭食</text>
  <line x1="240.0" y1="226.0" x2="340.0" y2="262.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="334.8" y1="257.4" x2="340.0" y2="262.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="333.0" y1="262.2" x2="340.0" y2="262.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="380.0" y1="226.0" x2="380.0" y2="258.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="382.6" y1="251.5" x2="380.0" y2="258.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="377.4" y1="251.5" x2="380.0" y2="258.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="520.0" y1="226.0" x2="420.0" y2="262.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="427.0" y1="262.2" x2="420.0" y2="262.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="425.2" y1="257.4" x2="420.0" y2="262.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <rect x="300.0" y="262.0" width="160.0" height="64.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="380.0" y="290.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.5" fill="#25211D" letter-spacing="0.4">操以受命</text>
  <text x="380.0" y="312.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.3" fill="#994433" letter-spacing="0.4">手持其物，受尊者之命</text>
  <line x1="380.0" y1="326.0" x2="380.0" y2="354.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="382.6" y1="347.5" x2="380.0" y2="354.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="377.4" y1="347.5" x2="380.0" y2="354.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="380.0" y="378.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#994433" letter-spacing="0.4">如使之容：先习威仪进退，如至所使之国</text>
  <text x="60.0" y="410.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">注：「问犹遗也」——问必以物表意；苞以苇茅，箪圆笥方。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　赠物不是随手递出，是一桩有命、有容的事。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 凡以弓剑</text>
</svg>