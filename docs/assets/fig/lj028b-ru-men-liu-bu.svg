<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="730" height="490" fill="#DCD5C8"/>
  <rect x="16" y="16" width="728" height="488" fill="#DCD5C8"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="17" fill="#25211D" letter-spacing="3">入门七节：先察后入</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="0.8"/>
  <rect x="60" y="112" width="148" height="74" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="72" y="132" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="1">一</text>
  <text x="72" y="152" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.5">将上堂，声必扬</text>
  <text x="72" y="174" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">警内人也</text>
  <rect x="228" y="112" width="148" height="74" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="240" y="132" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="1">二</text>
  <text x="240" y="152" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.5">户外有二屦</text>
  <text x="240" y="174" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">先察后入，不掩人私</text>
  <rect x="396" y="112" width="148" height="74" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="408" y="132" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="1">三</text>
  <text x="408" y="152" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.5">将入户，视必下</text>
  <text x="408" y="174" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">恐睹人私</text>
  <rect x="564" y="112" width="148" height="74" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="576" y="132" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="1">四</text>
  <text x="576" y="152" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.5">入户奉扃</text>
  <text x="576" y="174" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">手若捧扃，视瞻毋回</text>
  <rect x="396" y="286" width="148" height="74" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="408" y="306" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="1">五</text>
  <text x="408" y="326" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.5">户开亦开，户阖亦阖</text>
  <text x="408" y="348" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">不以后来变先</text>
  <rect x="228" y="286" width="148" height="74" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="240" y="306" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="1">六</text>
  <text x="240" y="326" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.5">有后入者，阖而勿遂</text>
  <text x="240" y="348" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">示不拒人</text>
  <rect x="60" y="286" width="148" height="74" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="72" y="306" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="1">七</text>
  <text x="72" y="326" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.5">抠衣趋隅，慎唯诺</text>
  <text x="72" y="348" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">升席由下；不先举</text>
  <line x1="208" y1="149" x2="228" y2="149" stroke="#994433" stroke-width="1.2"/>
  <line x1="228" y1="149" x2="221.857" y2="152.356" stroke="#994433" stroke-width="1.2"/>
  <line x1="228" y1="149" x2="221.857" y2="145.644" stroke="#994433" stroke-width="1.2"/>
