  <line x1="396" y1="149" x2="389.857" y2="152.356" stroke="#994433" stroke-width="1.2"/>
  <line x1="396" y1="149" x2="389.857" y2="145.644" stroke="#994433" stroke-width="1.2"/>
  <line x1="544" y1="149" x2="564" y2="149" stroke="#994433" stroke-width="1.2"/>
  <line x1="564" y1="149" x2="557.857" y2="152.356" stroke="#994433" stroke-width="1.2"/>
  <line x1="564" y1="149" x2="557.857" y2="145.644" stroke="#994433" stroke-width="1.2"/>
  <line x1="644" y1="190" x2="644" y2="242" stroke="#994433" stroke-width="1.2"/>
  <line x1="644" y1="242" x2="640.644" y2="235.857" stroke="#994433" stroke-width="1.2"/>
  <line x1="644" y1="242" x2="647.356" y2="235.857" stroke="#994433" stroke-width="1.2"/>
  <text x="654" y="220" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#9A9186" letter-spacing="1">入室</text>
  <line x1="208" y1="323" x2="188" y2="323" stroke="#994433" stroke-width="1.2"/>
  <line x1="188" y1="323" x2="194.143" y2="319.644" stroke="#994433" stroke-width="1.2"/>
  <line x1="188" y1="323" x2="194.143" y2="326.356" stroke="#994433" stroke-width="1.2"/>
  <line x1="376" y1="323" x2="356" y2="323" stroke="#994433" stroke-width="1.2"/>
  <line x1="356" y1="323" x2="362.143" y2="319.644" stroke="#994433" stroke-width="1.2"/>
  <line x1="356" y1="323" x2="362.143" y2="326.356" stroke="#994433" stroke-width="1.2"/>
  <line x1="544" y1="323" x2="524" y2="323" stroke="#994433" stroke-width="1.2"/>
  <line x1="524" y1="323" x2="530.143" y2="319.644" stroke="#994433" stroke-width="1.2"/>
  <line x1="524" y1="323" x2="530.143" y2="326.356" stroke="#994433" stroke-width="1.2"/>
  <rect x="60" y="386" width="660" height="44" fill="#F7F4EE" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="390" y="404" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="1">先看：门外几双鞋、屋里有无语声</text>
  <text x="390" y="421" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="1">后入：低头、捧手、随开随阖、不关死</text>
  <line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="1"/>
  <text x="380" y="468" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D" letter-spacing="2">客之礼，不在客气，在不侵入</text>
  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186" letter-spacing="1">图二 · 入门七节：先察后入 · lj028b</text>
</svg>
