<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="730" height="490" fill="#DCD5C8"/>
  <rect x="16" y="16" width="728" height="488" fill="#DCD5C8"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="17" fill="#25211D" letter-spacing="3">三藏：夜深、倦意、嫌恶</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="0.8"/>
  <text x="150" y="130" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#25211D" letter-spacing="1">一　烛不见跋</text>
  <line x1="150" y1="186" x2="150" y2="206" stroke="#7C6D5C" stroke-width="1.2"/>
  <path d="M132,206 L168,206 L162,262 L138,262 Z" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="150" y="246" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0">盂</text>
  <path d="M128,206 L172,206" stroke="#7C6D5C" stroke-width="2"/>
  <line x1="142" y1="200" x2="158" y2="200" stroke="#7C6D5C" stroke-width="0.8"/>
  <text x="150" y="182" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#994433" letter-spacing="0.3">残本在此</text>
  <text x="150" y="286" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">客不见烬，不知夜深</text>
  <text x="220" y="130" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8" fill="#9A9186" letter-spacing="0"></text>
  <text x="430" y="130" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#25211D" letter-spacing="1">二　尊客之前不叱狗</text>
  <path d="M392,214 C392,196 430,196 430,214 L430,238 L392,238 Z" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <circle cx="444" cy="204" r="12" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <line x1="432" y1="196" x2="438" y2="206" stroke="#7C6D5C" stroke-width="0.9"/>
  <line x1="444" y1="192" x2="448" y2="186" stroke="#7C6D5C" stroke-width="0.9"/>
  <line x1="392" y1="238" x2="392" y2="252" stroke="#7C6D5C" stroke-width="1"/>
  <line x1="404" y1="238" x2="404" y2="252" stroke="#7C6D5C" stroke-width="1"/>
  <line x1="420" y1="238" x2="420" y2="252" stroke="#7C6D5C" stroke-width="1"/>
  <line x1="430" y1="238" x2="430" y2="252" stroke="#7C6D5C" stroke-width="1"/>
  <path d="M392,208 C378,204 376,192 386,190" fill="none" stroke="#7C6D5C" stroke-width="1"/>
  <rect x="470" y="190" width="44" height="26" fill="#F7F4EE" stroke="#994433" stroke-width="1"/>
  <text x="492" y="208" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="0">叱</text>
  <line x1="486" y1="172" x2="498" y2="184" stroke="#994433" stroke-width="1.4"/>
  <line x1="486" y1="184" x2="498" y2="172" stroke="#994433" stroke-width="1.4"/>
  <text x="430" y="286" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">主人骂狗，客听成骂己</text>
  <text x="430" y="304" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#9A9186" letter-spacing="0.3">卑客亦当然（疏）</text>
  <text x="620" y="130" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#25211D" letter-spacing="1">三　让食不唾</text>
  <path d="M584,200 C610,232 650,232 676,200" fill="none" stroke="#7C6D5C" stroke-width="1.4"/>
  <line x1="584" y1="200" x2="676" y2="200" stroke="#7C6D5C" stroke-width="1.4"/>
  <circle cx="630" cy="208" r="2.5" fill="#7C6D5C" stroke="#7C6D5C" stroke-width="0.7"/>
  <circle cx="640" cy="214" r="2" fill="#7C6D5C" stroke="#7C6D5C" stroke-width="0.7"/>
  <line x1="623" y1="179" x2="637" y2="193" stroke="#994433" stroke-width="1.4"/>
  <line x1="623" y1="193" x2="637" y2="179" stroke="#994433" stroke-width="1.4"/>
  <text x="630" y="254" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">一面劝食，一面吐</text>
  <text x="630" y="272" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#9A9186" letter-spacing="0.3">嫌有秽恶</text>
  <line x1="60" y1="318" x2="700" y2="318" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="86" y="342" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.4">三藏皆非欺人：所藏者是己之倦与嫌，非事之实。</text>
  <text x="86" y="364" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0.4">古者以火炬为烛，残本堆积即是钟表；藏之，则不催客。</text>
  <text x="86" y="390" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="0.4">今日之三藏：不在客前看表，不当客前面露不耐，不对所荐作嫌态。</text>
  <line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="1"/>
  <text x="380" y="468" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D" letter-spacing="2">不让人看出你盼他走</text>
  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186" letter-spacing="1">图二 · 三藏：夜深、倦意、嫌恶 · lj040b</text>
</svg>
