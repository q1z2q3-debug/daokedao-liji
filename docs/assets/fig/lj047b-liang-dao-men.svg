<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="19" fill="#25211D" letter-spacing="3">两道门限：不入、不出</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <line x1="380.0" y1="110.0" x2="380.0" y2="248.0" stroke="#7C6D5C" stroke-width="1.4"/>
  <line x1="380.0" y1="312.0" x2="380.0" y2="344.0" stroke="#7C6D5C" stroke-width="1.4"/>
  <text x="210.0" y="140.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.0" fill="#994433" letter-spacing="1.0">内</text>
  <text x="210.0" y="162.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9.0" fill="#9A9186">织纴</text>
  <text x="560.0" y="140.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.0" fill="#994433" letter-spacing="1.0">外</text>
  <text x="560.0" y="162.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9.0" fill="#9A9186">官政</text>
  <line x1="470.0" y1="266.0" x2="300.0" y2="266.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="300.0" y1="266.0" x2="305.3" y2="268.9" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="300.0" y1="266.0" x2="305.3" y2="263.1" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="373.0" y1="259.0" x2="387.0" y2="273.0" stroke="#994433" stroke-width="1.4"/>
  <line x1="387.0" y1="259.0" x2="373.0" y2="273.0" stroke="#994433" stroke-width="1.4"/>
  <text x="474.0" y="262.0" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.0" fill="#7C6D5C">外言不入</text>
  <line x1="300.0" y1="296.0" x2="470.0" y2="296.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="470.0" y1="296.0" x2="464.7" y2="293.1" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="470.0" y1="296.0" x2="464.7" y2="298.9" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="373.0" y1="289.0" x2="387.0" y2="303.0" stroke="#994433" stroke-width="1.4"/>
  <line x1="387.0" y1="289.0" x2="373.0" y2="303.0" stroke="#994433" stroke-width="1.4"/>
  <text x="474.0" y="292.0" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.0" fill="#7C6D5C">内言不出</text>
  <line x1="60.0" y1="352.0" x2="700.0" y2="352.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="376.0" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.4">两句是一道门的两面：一句防进，一句防出。</text>
  <text x="80.0" y="396.0" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">梱，门限也；注：「不以相问」——不拿它去干涉。</text>
  <text x="80.0" y="418.0" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.0" fill="#994433" letter-spacing="0.4">只讲一句，即成封锁或隐瞒。</text>
  <line x1="60" y1="444" x2="700" y2="444" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="470" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="14" fill="#25211D" letter-spacing="2">各守其界，各过其门</text>
  <text x="700" y="492" text-anchor="end" font-family="Noto Serif SC,serif" font-size="10" fill="#9A9186">图二 · 两道门限：不入、不出 · lj047b</text>
