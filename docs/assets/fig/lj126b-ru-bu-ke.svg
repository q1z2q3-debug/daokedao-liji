<text x="462" y="350" font-size="10" fill="#7C6D5C" text-anchor="middle">如不克：作出不胜之状</text>
<text x="590" y="206" font-size="9.5" fill="#9A9186" text-anchor="start">克，胜也</text>
<text x="590" y="226" font-size="10" fill="#994433" text-anchor="start">「如」字是礼眼</text>
<text x="170" y="120" font-size="12" fill="#25211D" text-anchor="start">重慎之也</text>
<text x="170" y="144" font-size="10" fill="#9A9186" text-anchor="start">器虽轻小，执之恒如实重</text><line x1="70" y1="444" x2="690" y2="444" stroke="#DCD5C8" stroke-width="1.0"/><text x="70" y="468" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="13" fill="#994433">结论　礼常不是加动作，是把手上的力收起来</text><text x="690" y="486" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="11" fill="#9A9186" text-anchor="end">图二 · 轻而如重</text></svg>