<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="730" height="490" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>

  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif SC,Songti SC,serif" font-size="17" fill="#25211D" letter-spacing="3">敬之三處　與　四不可</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="0.8"/>

  <!-- 上：心 貌 言 -->
  <rect x="52" y="100" width="132" height="78" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="118" y="132" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="20" fill="#25211D" letter-spacing="3">心</text>
  <text x="118" y="158" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11.5" fill="#7C6D5C">毋不敬</text>

  <rect x="200" y="100" width="132" height="78" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="266" y="132" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="20" fill="#25211D" letter-spacing="3">貌</text>
  <text x="266" y="158" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11.5" fill="#7C6D5C">儼若思</text>

  <rect x="348" y="100" width="132" height="78" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="414" y="132" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="20" fill="#25211D" letter-spacing="3">言</text>
  <text x="414" y="158" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11.5" fill="#7C6D5C">安定辭</text>

  <!-- 三线汇聚 -->
  <line x1="118" y1="178" x2="252" y2="242" stroke="#994433" stroke-width="0.9"/>
  <line x1="266" y1="178" x2="266" y2="242" stroke="#994433" stroke-width="0.9"/>
  <line x1="414" y1="178" x2="280" y2="242" stroke="#994433" stroke-width="0.9"/>

  <rect x="190" y="242" width="152" height="62" fill="#F7F4EE" stroke="#25211D" stroke-width="1.1"/>
  <text x="266" y="272" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="18" fill="#25211D" letter-spacing="3">安民</text>
  <text x="266" y="292" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">此上三句，可以安民</text>

  <!-- 右：四不可，節為界 -->
  <text x="646" y="96" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="12" fill="#7C6D5C" letter-spacing="2">四不可</text>
  <rect x="556" y="106" width="180" height="42" fill="#F7F4EE" stroke="#DCD5C8" stroke-width="1"/>
  <text x="646" y="133" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D">敖不可長</text>
  <rect x="556" y="156" width="180" height="42" fill="#F7F4EE" stroke="#DCD5C8" stroke-width="1"/>
  <text x="646" y="183" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D">欲不可從</text>
  <rect x="556" y="206" width="180" height="42" fill="#F7F4EE" stroke="#DCD5C8" stroke-width="1"/>
  <text x="646" y="233" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D">志不可滿</text>
  <rect x="556" y="256" width="180" height="42" fill="#F7F4EE" stroke="#DCD5C8" stroke-width="1"/>
  <text x="646" y="283" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D">樂不可極</text>

  <line x1="528" y1="98" x2="528" y2="306" stroke="#994433" stroke-width="0.9" stroke-dasharray="5 5"/>
  <text x="520" y="150" text-anchor="middle" transform="rotate(-90 520 150)" font-family="Noto Serif SC,serif" font-size="15" fill="#994433" letter-spacing="6">節</text>

  <!-- 底：一句 -->
  <line x1="52" y1="366" x2="708" y2="366" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="380" y="406" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="14.5" fill="#25211D" letter-spacing="1.5">敬為根　節為守　安民其效也</text>
  <text x="380" y="434" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="#7C6D5C" letter-spacing="1">鄭注：禮主於敬　｜　四者，慢遊之道，桀紂所以自禍</text>

  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186">图二 · 毋不敬 · lj001b</text>
</svg>