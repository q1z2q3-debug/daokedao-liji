<text x="200" y="232" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">爵弁绦衣</text>
<text x="200" y="252" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">采（丝衣有文）</text>
<line x1="120" y1="142" x2="280" y2="142" stroke="#994433" stroke-width="1.3" stroke-dasharray="5,3"/>
