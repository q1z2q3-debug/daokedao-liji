<text x="575" y="310" font-size="12" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">非也</text>
<text x="380" y="380" font-size="11" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">服，跟着「见了没有」走　｜　哀，不能由别人代</text>
