<text x="400" y="340" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">采不加麻</text>
<rect x="500" y="168" width="150" height="120" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.2"/>
<text x="575" y="232" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">有司</text>
<text x="575" y="252" font-size="11" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">代哭</text>
