<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">赙布有余，当归原主</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="96" y="176" width="140" height="66" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="166" y="202" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">四方赙布</text>
<text x="166" y="224" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">本为助丧</text>
<line x1="242" y1="220" x2="306" y2="220" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="310" y="140" width="150" height="220" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="385" y="172" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">丧家</text>
<line x1="340" y1="186" x2="430" y2="186" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="385" y="214" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">送终既具</text>
<text x="385" y="242" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">用已足</text>
<text x="385" y="300" font-size="11" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">赙布有余</text>
<line x1="306" y1="330" x2="242" y2="330" stroke="#994433" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="96" y="300" width="140" height="60" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="166" y="324" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">归还原主</text>
<text x="166" y="344" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">非散于人</text>
<text x="520" y="176" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">时人皆贪</text>
<text x="520" y="206" font-size="12" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">此家独不取</text>
<text x="520" y="260" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">夫子曰</text>
<text x="520" y="292" font-size="14" fill="#994433" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">可也</text>
<text x="520" y="316" font-size="9" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">最低一等</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">那笔钱当初为什么给你，用途没了，它就不该在你手里</text>
</svg>