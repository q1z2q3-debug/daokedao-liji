<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">问了就要办：礼不许空口做人情</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="70.0" y="106.0" width="190.0" height="92.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="165.0" y="138.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">问其所费</text>
  <line x1="158.0" y1="157.0" x2="172.0" y2="171.0" stroke="#DCD5C8" stroke-width="1.0"/>
  <line x1="172.0" y1="157.0" x2="158.0" y2="171.0" stroke="#DCD5C8" stroke-width="1.0"/>
  <text x="165.0" y="190.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">不能赙</text>
  <rect x="270.0" y="106.0" width="190.0" height="92.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="365.0" y="138.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">问其所欲</text>
  <line x1="358.0" y1="157.0" x2="372.0" y2="171.0" stroke="#DCD5C8" stroke-width="1.0"/>
  <line x1="372.0" y1="157.0" x2="358.0" y2="171.0" stroke="#DCD5C8" stroke-width="1.0"/>
  <text x="365.0" y="190.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">不能遗</text>
  <rect x="470.0" y="106.0" width="190.0" height="92.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="565.0" y="138.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">问其所舍</text>
  <line x1="558.0" y1="157.0" x2="572.0" y2="171.0" stroke="#DCD5C8" stroke-width="1.0"/>
  <line x1="572.0" y1="157.0" x2="558.0" y2="171.0" stroke="#DCD5C8" stroke-width="1.0"/>
  <text x="565.0" y="190.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">不能馆</text>
  <text x="60.0" y="240.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">问窘处而不解，是把人再窘一次。</text>
  <rect x="200.0" y="266.0" width="360.0" height="64.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="380.0" y="292.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">赐人不曰来取｜与人不问所欲</text>
  <text x="380.0" y="314.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">己物或非其所欲，问了不给，反成失信</text>
  <text x="60.0" y="362.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.2" fill="#25211D" letter-spacing="0.4">注：「皆为伤恩也」——问而不办，比不问更伤。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　口与手要一致：问了就要办。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 吊丧弗能赙</text>
</svg>