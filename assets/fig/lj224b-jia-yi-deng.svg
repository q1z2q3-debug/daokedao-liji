<line x1="70" y1="250" x2="560" y2="250" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="5,4"/>
<text x="70" y="240" font-size="9.5" fill="#7C6D5C" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">礼之限：禫祭县而不乐，吉祭而复寝</text>
<rect x="142" y="292" width="16" height="72" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.9"/>
