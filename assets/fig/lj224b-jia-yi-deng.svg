<rect x="322" y="250" width="16" height="114" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.3"/>
<text x="330" y="232" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">献子</text>
