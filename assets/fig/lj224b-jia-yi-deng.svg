<line x1="180" y1="288" x2="300" y2="288" stroke="#DCD5C8" stroke-width="0.9" marker-end="url(#ah)"/>
<text x="240" y="282" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">时人在限下</text>
<rect x="590" y="130" width="110" height="88" fill="#F7F4EE" stroke="#DCD5C8" stroke-width="0.7"/>
<text x="645" y="152" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">礼所许</text>
<text x="645" y="172" font-size="9.5" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">县而不作</text>
<text x="645" y="192" font-size="9.5" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">吉祭复寝</text>
<line x1="596" y1="204" x2="694" y2="204" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="645" y="268" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">献子所守</text>
<text x="645" y="288" font-size="9.5" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">只是礼之下限</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">加于人一等者，非加于礼一等</text>
