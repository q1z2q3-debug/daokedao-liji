<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">谦的分界：馔为谁而设</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="80.0" y="104.0" width="260.0" height="84.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="210.0" y="134.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">常礼</text>
  <text x="210.0" y="172.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">受盛馔则辞：贱不能当</text>
  <line x1="340.0" y1="146.0" x2="420.0" y2="146.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="413.5" y1="143.4" x2="420.0" y2="146.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="413.5" y1="148.6" x2="420.0" y2="146.0" stroke="#7C6D5C" stroke-width="1.0"/>
  <rect x="420.0" y="104.0" width="260.0" height="84.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="550.0" y="134.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">例外</text>
  <text x="550.0" y="164.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#994433" letter-spacing="0.4">馔不在己</text>
  <line x1="420.0" y1="206.0" x2="680.0" y2="206.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="480.0" y="238.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">侍食长者：同馔</text>
  <text x="620.0" y="238.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">陪客偶坐：同坐</text>
  <text x="380.0" y="272.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">馔既不为己设，辞之无所指；虚辞使长者不安。</text>
  <text x="380.0" y="300.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">注：「辞之，为长者嫌。」</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　谦而使人不安，则非礼。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 御同于长者</text>
</svg>