<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">生馆死殡，不使人无可措手足</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="440" y="176" width="150" height="96" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="515" y="206" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">宾客至</text>
<text x="515" y="232" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">无所馆</text>
<text x="515" y="256" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">礼已尽</text>
<line x1="436" y1="206" x2="306" y2="168" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="436" y1="242" x2="306" y2="296" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="120" y="134" width="186" height="68" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="213" y="160" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">生</text>
<text x="213" y="184" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">于我乎馆</text>
<rect x="120" y="268" width="186" height="68" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="213" y="294" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">死</text>
<text x="213" y="318" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">于我乎殡</text>
<circle cx="430" cy="224" r="3" fill="#994433"/>
<text x="300" y="392" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">不问其国、其名、其贵贱</text>
<text x="300" y="414" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">「于我乎」者，不假他处</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">仁者不厄人：找地方还要商量，接进我家不必等</text>
</svg>