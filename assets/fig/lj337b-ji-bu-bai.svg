<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">三动成辞：伏·起·退</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<path d="M180,320 L196,282 L286,278 L316,320 Z" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.3"/>
<line x1="150" y1="320" x2="350" y2="320" stroke="#7C6D5C" stroke-width="1.2"/>
<line x1="196" y1="282" x2="300" y2="282" stroke="#9A9186" stroke-width="0.9"/>
<circle cx="300" cy="276" r="3" fill="#9A9186"/>
<line x1="360" y1="240" x2="420" y2="240" stroke="#994433" stroke-width="1.2"/>
<line x1="360" y1="280" x2="420" y2="280" stroke="#7C6D5C" stroke-width="1.2"/>
<line x1="360" y1="320" x2="420" y2="320" stroke="#7C6D5C" stroke-width="1.2"/>
<text x="440" y="244" font-size="10" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">稽颡：为父</text>
<text x="440" y="284" font-size="10" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">哭而起：爱父</text>
<text x="440" y="324" font-size="10" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">不私：远利</text>
<line x1="300" y1="340" x2="300" y2="380" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="300" y="398" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">不成拜</text>
<text x="520" y="190" font-size="11" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">穆公曰：仁夫</text>
<text x="380" y="428" font-size="10" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">礼停在半处：礼成而拜不成</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">三动无一语，而三义尽在其中</text>
</svg>