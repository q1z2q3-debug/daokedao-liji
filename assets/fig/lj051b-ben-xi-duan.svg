  <text x="180.0" y="204.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C">世有本系，则知来处</text>
  <text x="180.0" y="224.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#994433">同姓不取：为其近禽兽</text>
  <text x="520.0" y="110.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.0" fill="#994433" letter-spacing="1.0">妾：本系已断</text>
