  <text x="520.0" y="204.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C">世无本系，则无从守</text>
  <text x="520.0" y="224.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#994433">不知其姓，则卜之</text>
