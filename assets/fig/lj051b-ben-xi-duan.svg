  <text x="530.0" y="366.0" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#994433">卜吉则取之（熊氏）</text>
  <line x1="60.0" y1="384.0" x2="700.0" y2="384.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="406.0" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.4">禁所守者是「有本系」，补所济者是「本系已失」。</text>
  <text x="80.0" y="426.0" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">注只五字「为其近禽兽」——义在无别，不在卫生。</text>
  <line x1="60" y1="444" x2="700" y2="444" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="470" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="14" fill="#25211D" letter-spacing="2">守得住就守，守不住则有补</text>
  <text x="700" y="492" text-anchor="end" font-family="Noto Serif SC,serif" font-size="10" fill="#9A9186">图二 · 本系：可追与已断 · lj051b</text>
