<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">全交：把对方的好留一分</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="70.0" y="104.0" width="280.0" height="150.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="210.0" y="130.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">欢（饮食）</text>
  <path d="M180 156 L240 156 L232 206 q-22 10 -44 0 L180 156" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <line x1="184.0" y1="186.0" x2="236.0" y2="186.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="210.0" y="166.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">余</text>
  <text x="210.0" y="200.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">已</text>
  <text x="210.0" y="226.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">只动一半，壶尚有余</text>
  <rect x="410.0" y="104.0" width="280.0" height="150.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="550.0" y="130.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">忠（衣服）</text>
  <rect x="492.0" y="168.0" width="104.0" height="14.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.6"/>
  <rect x="496.0" y="180.0" width="104.0" height="14.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.6"/>
  <rect x="500.0" y="192.0" width="104.0" height="14.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.6"/>
  <text x="550.0" y="214.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">取一层，余仍叠</text>
  <text x="550.0" y="232.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.0" fill="#9A9186" letter-spacing="0.4">（不乱其叠）</text>
  <text x="60.0" y="286.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.2" fill="#25211D" letter-spacing="0.4">注：欢谓饮食，忠谓衣服之物｜疏：承欢易，致忠难</text>
  <text x="60.0" y="312.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.2" fill="#7C6D5C" letter-spacing="0.4">若使彼罄尽，则交结之道不全；不竭尽，交乃全。</text>
  <text x="60.0" y="338.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">君子之实：博闻强识而让，敦善行而不怠。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　不留余地，交情就用尽了。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 博闻强识而让</text>
</svg>