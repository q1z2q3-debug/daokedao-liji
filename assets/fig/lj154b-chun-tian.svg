<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#7C6D5C"/></marker></defs><rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.8"/><rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.5"/><text x="380" y="52" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="15" fill="#25211D" text-anchor="middle" letter-spacing="3">一级一级收得紧</text><line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.2"/><rect x="96" y="190" width="190" height="160" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/><line x1="146" y1="190" x2="246" y2="190" stroke="#F7F4EE" stroke-width="7"/><text x="191" y="376" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="10" fill="#25211D" text-anchor="middle" letter-spacing="0">国君不围</text><text x="191" y="152" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9" fill="#9A9186" text-anchor="middle" letter-spacing="0">留一面</text><path d="M300 336 L300 196 L424 196 L424 336" stroke="#7C6D5C" stroke-width="1.0" fill="none"/><circle cx="326" cy="272" r="3" fill="#7C6D5C"/><circle cx="348" cy="272" r="3" fill="#7C6D5C"/><circle cx="370" cy="272" r="3" fill="#7C6D5C"/><circle cx="392" cy="272" r="3" fill="#7C6D5C"/><circle cx="414" cy="272" r="3" fill="#7C6D5C"/><text x="362" y="376" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="10" fill="#25211D" text-anchor="middle" letter-spacing="0">大夫不掩群</text><text x="362" y="158" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9" fill="#9A9186" text-anchor="middle" letter-spacing="0">不尽取</text><ellipse cx="556" cy="286" rx="30" ry="16" fill="none" stroke="#7C6D5C" stroke-width="1.0"/><circle cx="602" cy="266" r="9" fill="none" stroke="#7C6