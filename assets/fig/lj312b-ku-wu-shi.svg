<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">哭无时，而反必有祭</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="150" y="118" width="430" height="34" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="160" y="140" font-size="10" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">初丧</text>
<text x="568" y="140" font-size="9" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">哭不绝声</text>
<rect x="150" y="176" width="330" height="34" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="160" y="198" font-size="10" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">殡后</text>
<text x="468" y="198" font-size="9" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">庐中思忆则哭</text>
<rect x="150" y="234" width="220" height="34" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="160" y="256" font-size="10" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">小祥后</text>
<text x="358" y="256" font-size="9" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">哀至而哭</text>
<line x1="120" y1="300" x2="690" y2="300" stroke="#DCD5C8" stroke-width="0.8"/>
<line x1="300" y1="320" x2="460" y2="320" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="380" y="344" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">君使之</text>
<line x1="460" y1="352" x2="300" y2="352" stroke="#994433" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="380" y="376" font-size="10" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">反必有祭：我回来了</text>
<text x="380" y="406" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">出必告、反必面——对象换了，线没断</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">祭告不是给神的，是完成一件未完成的关系</text>
</svg>