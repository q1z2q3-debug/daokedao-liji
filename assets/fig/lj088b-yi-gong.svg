<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">一把弓的四个动作</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="60.0" y="110.0" width="158.0" height="110.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="139.0" y="142.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#994433" letter-spacing="0.4">形</text>
  <text x="139.0" y="178.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">张尚筋／弛尚角</text>
  <line x1="221.0" y1="165.0" x2="230.0" y2="165.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <line x1="223.5" y1="162.4" x2="230.0" y2="165.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <line x1="223.5" y1="167.6" x2="230.0" y2="165.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <rect x="228.0" y="110.0" width="158.0" height="110.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="307.0" y="142.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#994433" letter-spacing="0.4">手</text>
  <text x="307.0" y="178.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">右执箫／左承弣</text>
  <line x1="389.0" y1="165.0" x2="398.0" y2="165.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <line x1="391.5" y1="162.4" x2="398.0" y2="165.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <line x1="391.5" y1="167.6" x2="398.0" y2="165.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <rect x="396.0" y="110.0" width="158.0" height="110.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="475.0" y="142.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#994433" letter-spacing="0.4">佩</text>
  <text x="475.0" y="178.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">尊卑垂帨</text>
  <line x1="557.0" y1="165.0" x2="566.0" y2="165.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <line x1="559.5" y1="162.4" x2="566.0" y2="165.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <line x1="559.5" y1="167.6" x2="566.0" y2="165.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <rect x="564.0" y="110.0" width="158.0" height="110.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="643.0" y="142.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#994433" letter-spacing="0.4">避</text>
  <text x="643.0" y="178.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">还辟辟拜</text>
  <text x="60.0" y="254.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">注：「弓有往来体，皆欲令其下曲，隤然顺也」——先顺物之性。</text>
  <text x="60.0" y="280.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">授受之仪，尊卑一：折身如磬，佩巾下垂，无贵贱之别。</text>
  <text x="60.0" y="306.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">主人拜则客避，谦不敢当。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　兵器转手，也做成四个精确动作。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 遗人弓者</text>
</svg>