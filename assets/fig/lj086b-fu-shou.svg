<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">一罩之差：防的是喙，护的是人</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="80.0" y="104.0" width="280.0" height="140.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="220.0" y="132.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.5" fill="#25211D" letter-spacing="0.4">献鸟</text>
  <rect x="120.0" y="150.0" width="80.0" height="64.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="120.0" y1="150.0" x2="200.0" y2="214.0" stroke="#9A9186" stroke-width="0.8"/>
  <line x1="200.0" y1="150.0" x2="120.0" y2="214.0" stroke="#9A9186" stroke-width="0.8"/>
  <text x="160.0" y="232.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">小竹笼罩其首</text>
  <text x="212.0" y="160.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">余身露于外</text>
  <text x="140.0" y="262.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">佛其首：戾转其首，或以笼罩之</text>
  <rect x="400.0" y="104.0" width="280.0" height="140.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="540.0" y="132.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.5" fill="#25211D" letter-spacing="0.4">畜鸟</text>
  <text x="540.0" y="186.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#994433" letter-spacing="0.4">勿佛</text>
  <text x="540.0" y="232.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">养则驯，不必扭首加笼</text>
  <text x="60.0" y="300.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.3" fill="#25211D" letter-spacing="0.4">注：「为其喙害人也」｜王肃主扭首，郑玄主小竹笼，疏谓义同。</text>
  <text x="60.0" y="326.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">礼在此极实在：先保人不受伤，再谈授受之仪。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　同一鸟，经人手则去其野性；礼之宽严随物。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 献鸟者佛其首</text>
</svg>