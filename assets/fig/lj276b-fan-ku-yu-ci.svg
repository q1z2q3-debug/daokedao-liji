<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">许他一处可哭之地</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="140" y="120" width="130" height="42" fill="#F7F4EE" stroke="#994433" stroke-width="1.2"/>
<text x="205" y="146" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">门</text>
<line x1="172" y1="162" x2="172" y2="402" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="248" y1="162" x2="248" y2="402" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="210" y="420" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">巷</text>
<rect x="180" y="262" width="60" height="44" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="210" y="290" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">客</text>
<line x1="210" y1="258" x2="210" y2="168" stroke="#994433" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="268" y="216" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">反哭于尔次</text>
<text x="205" y="100" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">次，舍也</text>
<text x="330" y="300" font-size="11" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">北面而吊</text>
<line x1="330" y1="288" x2="244" y2="288" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="380" y="356" font-size="11" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">守界 → 破界：许其专有，若其自有然</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">先给一处地方，人才能站住</text>
</svg>