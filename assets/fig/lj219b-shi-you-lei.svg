<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">士之有诔，自此始</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="80" y="132" width="128" height="34" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.9"/>
<text x="144" y="154" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">御·县贲父</text>
<line x1="210" y1="150" x2="300" y2="208" stroke="#7C6D5C" stroke-width="0.9" marker-end="url(#ah)"/>
<rect x="80" y="208" width="128" height="34" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.9"/>
<text x="144" y="230" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">右·卜国</text>
<line x1="210" y1="226" x2="300" y2="208" stroke="#7C6D5C" stroke-width="0.9" marker-end="url(#ah)"/>
<rect x="80" y="284" width="128" height="34" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.9"/>
<text x="144" y="306" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">圉人·浴马</text>
<line x1="210" y1="302" x2="300" y2="208" stroke="#7C6D5C" stroke-width="0.9" marker-end="url(#ah)"/>
<rect x="300" y="166" width="112" height="84" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.3"/>
<text x="356" y="200" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">士</text>
<text x="356" y="224" font-size="9.5" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">生无爵，死无谥</text>
<line x1="414" y1="208" x2="496" y2="208" stroke="#7C6D5C" stroke-width="1.1" marker-end="url(#ah)"/>
<rect x="496" y="180" width="148" height="56" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.2"/>
<text x="570" y="208" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">诔·定谥</text>
<line x1="516" y1="226" x2="624" y2="226" stroke="#994433" stroke-width="1.4"/>
<text x="570" y="250" font-size="9.5" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">庄公诔之，士始有诔</text>
<line x1="300" y1="290" x2="644" y2="290" stroke="#DCD5C8" stroke-width="0.7"/>
<text x="300" y="320" font-size="10" fill="#7C6D5C" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">一句「末之，卜也」，使人赴死</text>
<text x="300" y="344" font-size="10" fill="#7C6D5C" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">一处流矢在白肉，使人得谥</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">追责之慎：先查其因，后定其罪</text>
</svg>