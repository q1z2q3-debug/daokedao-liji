<text x="288" y="264" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">君亲之疾</text>
<path d="M472,282 A44,44 0 0 0 560,282" fill="none" stroke="#7C6D5C" stroke-width="1.3"/>
<line x1="472" y1="282" x2="560" y2="282" stroke="#7C6D5C" stroke-width="1.3"/>
<text x="516" y="300" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">臣子先尝</text>
<path d="M486,246 Q446,206 396,196" fill="none" stroke="#994433" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="430" y="178" font-size="10" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">先尝而后进</text>
<line x1="500" y1="150" x2="500" y2="184" stroke="#7C6D5C" stroke-width="1.2"/>
<line x1="536" y1="150" x2="536" y2="177" stroke="#7C6D5C" stroke-width="1.2"/>
<line x1="572" y1="150" x2="572" y2="170" stroke="#7C6D5C" stroke-width="1.2"/>
<text x="636" y="150" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">三世相承</text>
<text x="536" y="404" font-size="11" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">医不三世，不服其药</text>
<line x1="60" y1="340" x2="380" y2="340" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="220" y="372" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">尝者，度其所堪</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">尝是先替人受一口，不是先替人试一毒</text>
</svg>