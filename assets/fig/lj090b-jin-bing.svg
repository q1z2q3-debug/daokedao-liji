<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">三条一理：锐不向人</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="60.0" y="104.0" width="200.0" height="120.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="160.0" y="132.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.5" fill="#25211D" letter-spacing="0.4">剑</text>
  <line x1="90.0" y1="176.0" x2="230.0" y2="176.0" stroke="#7C6D5C" stroke-width="3.0"/>
  <text x="96.0" y="168.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">首</text>
  <text x="220.0" y="168.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">锋</text>
  <text x="160.0" y="204.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">左首，锋向右</text>
  <rect x="280.0" y="104.0" width="200.0" height="120.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="380.0" y="132.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.5" fill="#25211D" letter-spacing="0.4">戈</text>
  <line x1="310.0" y1="176.0" x2="450.0" y2="176.0" stroke="#7C6D5C" stroke-width="3.0"/>
  <line x1="430.0" y1="176.0" x2="450.0" y2="152.0" stroke="#7C6D5C" stroke-width="2.4"/>
  <text x="316.0" y="168.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">鐏</text>
  <text x="452.0" y="150.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">刃</text>
  <text x="380.0" y="204.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">前鐏后刃</text>
  <rect x="500.0" y="104.0" width="200.0" height="120.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="600.0" y="132.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.5" fill="#25211D" letter-spacing="0.4">矛戟</text>
  <line x1="530.0" y1="176.0" x2="670.0" y2="176.0" stroke="#7C6D5C" stroke-width="3.0"/>
  <line x1="670.0" y1="176.0" x2="690.0" y2="176.0" stroke="#994433" stroke-width="2.2"/>
  <text x="536.0" y="168.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">镦</text>
  <text x="682.0" y="168.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">锋</text>
  <text x="600.0" y="204.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">前镦，锋向后</text>
  <text x="60.0" y="272.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.3" fill="#25211D" letter-spacing="0.4">鐏为锐底，镦为平底：柄尾形制不同，名亦不同。</text>
  <text x="60.0" y="298.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">疏：「不云左右而云前后者，互文也」——相对言前后，并授言左右。</text>
  <text x="60.0" y="324.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">注：「三兵鐏、镦虽在下，犹为首」——位置之尊卑，可随仪而转。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　不让锐处对人，先于一切仪节。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 进剑者左首</text>
</svg>