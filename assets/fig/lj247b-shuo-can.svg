<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">涕既出，须有着落</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="120" y="224" width="120" height="62" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="180" y="250" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">入而哭</text>
<text x="180" y="272" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">出涕</text>
<line x1="246" y1="255" x2="296" y2="255" stroke="#7C6D5C" stroke-width="1.1" marker-end="url(#ah)"/>
<line x1="304" y1="255" x2="392" y2="255" stroke="#DCD5C8" stroke-width="1.1" stroke-dasharray="5,5"/>
<text x="348" y="238" font-size="9.5" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">无从</text>
<line x1="400" y1="255" x2="448" y2="255" stroke="#7C6D5C" stroke-width="1.1" marker-end="url(#ah)"/>
<rect x="456" y="224" width="130" height="62" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="521" y="250" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">说骖</text>
<text x="521" y="272" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">以赙</text>
<text x="380" y="340" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">涕，情也；从，礼也</text>
<text x="380" y="372" font-size="9.5" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">客行无他物可以易之者</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">涕无从而后说骖，礼者副其情</text>
</svg>