<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">一个「乎」字，与一条长出来的服</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<text x="90" y="140" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">子游：其大功乎</text>
<rect x="90" y="170" width="540" height="22" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
