<text x="391" y="128" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">《丧服》无文</text>
<rect x="412" y="250" width="278" height="22" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
