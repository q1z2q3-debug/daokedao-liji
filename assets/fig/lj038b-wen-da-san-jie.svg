<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="730" height="490" fill="#DCD5C8"/>
  <rect x="16" y="16" width="728" height="488" fill="#DCD5C8"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="17" fill="#25211D" letter-spacing="3">应答三节：终、起、唯</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="0.8"/>
  <text x="86" y="124" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10.5" fill="#25211D" letter-spacing="1">一　终则对</text>
  <line x1="86" y1="150" x2="310" y2="150" stroke="#7C6D5C" stroke-width="1.6"/>
  <text x="86" y="168" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">先生问</text>
  <line x1="310" y1="142" x2="310" y2="158" stroke="#994433" stroke-width="1"/>
  <text x="316" y="140" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#994433" letter-spacing="0.3">话终</text>
  <line x1="344" y1="150" x2="420" y2="150" stroke="#994433" stroke-width="1.6"/>
  <text x="344" y="168" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#994433" letter-spacing="0.3">对</text>
  <text x="452" y="150" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0.4">不敢错乱尊者之言</text>
  <line x1="86" y1="178" x2="700" y2="178" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="86" y="204" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10.5" fill="#25211D" letter-spacing="1">二　请则起</text>
  <circle cx="96" cy="230" r="4" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.7"/>
  <text x="110" y="234" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#25211D" letter-spacing="0.3">请业：业谓篇卷</text>
  <circle cx="96" cy="254" r="4" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.7"/>
  <text x="110" y="258" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#25211D" letter-spacing="0.3">请益：受说不了，求师更明</text>
  <rect x="430" y="218" width="170" height="50" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="515" y="236" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D" letter-spacing="2">起</text>
  <text x="515" y="254" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">若今抠衣前请</text>
  <line x1="384" y1="242" x2="424" y2="242" stroke="#994433" stroke-width="1.2"/>
  <line x1="424" y1="242" x2="417.857" y2="245.356" stroke="#994433" stroke-width="1.2"/>
  <line x1="424" y1="242" x2="417.857" y2="238.644" stroke="#994433" stroke-width="1.2"/>
  <text x="86" y="284" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">两问皆起身：把「坐而受」换成「立而求」。</text>
  <line x1="86" y1="300" x2="700" y2="300" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="86" y="326" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10.5" fill="#25211D" letter-spacing="1">三　父召、先生召，无诺</text>
  <line x1="96" y1="368" x2="170" y2="368" stroke="#994433" stroke-width="1.2"/>
  <line x1="170" y1="368" x2="163.857" y2="371.356" stroke="#994433" stroke-width="1.2"/>
  <line x1="170" y1="368" x2="163.857" y2="364.644" stroke="#994433" stroke-width="1.2"/>
  <text x="133" y="358" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10" fill="#25211D" letter-spacing="1">唯</text>
  <text x="133" y="392" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#994433" letter-spacing="0.3">急应</text>
  <line x1="300" y1="368" x2="420" y2="368" stroke="#7C6D5C" stroke-width="1"/>
  <line x1="420" y1="368" x2="413.857" y2="371.356" stroke="#7C6D5C" stroke-width="1"/>
  <line x1="420" y1="368" x2="413.857" y2="364.644" stroke="#7C6D5C" stroke-width="1"/>
  <line x1="300" y1="368" x2="420" y2="368" stroke="#7C6D5C" stroke-width="0.6" stroke-dasharray="6 5"/>
  <text x="360" y="358" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10" fill="#7C6D5C" letter-spacing="1">诺</text>
  <text x="360" y="392" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">缓，似骄慢</text>
  <text x="452" y="364" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.4">唯恭于诺</text>
  <text x="452" y="382" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#994433" letter-spacing="0.3">应答之缓急，也是敬</text>
  <line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="1"/>
  <text x="380" y="468" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D" letter-spacing="2">抢的反面不是慢，是等</text>
  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186" letter-spacing="1">图二 · 应答三节：终、起、唯 · lj038b</text>
</svg>
