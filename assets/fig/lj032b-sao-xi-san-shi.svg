  <text x="86" y="380" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#25211D" letter-spacing="0.5">请席何乡：坐席问面</text>
  <text x="86" y="398" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#25211D" letter-spacing="0.5">请衽何趾：卧席问足</text>
  <text x="360" y="380" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#25211D" letter-spacing="0.5">南乡北乡，以西方为上</text>
  <text x="360" y="398" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#25211D" letter-spacing="0.5">东乡西乡，以南方为上</text>
  <text x="608" y="380" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="0.5">顺尊者所安</text>
  <text x="608" y="398" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0.5">不替尊者定方向</text>
  <line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="1"/>
  <text x="380" y="468" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D" letter-spacing="2">尘土往我这边，方向由尊者那边定</text>
  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186" letter-spacing="1">图二 · 扫席三事：帚、袂、箕 · lj032b</text>
