  <text x="500" y="224" text-anchor="end" font-family="Noto Serif SC,serif" font-size="8.5" fill="#994433" letter-spacing="0.5">左昂</text>
  <text x="664" y="272" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#994433" letter-spacing="0.5">右低</text>
  <text x="600" y="306" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="0.5">奉席如桥衡</text>
  <text x="600" y="324" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.5">如有首尾然</text>
