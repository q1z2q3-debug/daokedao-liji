<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">一授一受：两手一上一下，弓才不倾</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="70.0" y="104.0" width="620.0" height="150.0" fill="#F7F4EE" stroke="#DCD5C8" stroke-width="0.8"/>
  <line x1="70.0" y1="150.0" x2="120.0" y2="150.0" stroke="#7C6D5C" stroke-width="3.0"/>
  <line x1="120.0" y1="150.0" x2="260.0" y2="178.0" stroke="#7C6D5C" stroke-width="4.0"/>
  <line x1="260.0" y1="178.0" x2="430.0" y2="178.0" stroke="#7C6D5C" stroke-width="4.0"/>
  <line x1="430.0" y1="178.0" x2="560.0" y2="150.0" stroke="#7C6D5C" stroke-width="4.0"/>
  <line x1="560.0" y1="150.0" x2="690.0" y2="150.0" stroke="#7C6D5C" stroke-width="3.0"/>
  <text x="120.0" y="142.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">执箫</text>
  <text x="660.0" y="142.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">弓梢</text>
  <text x="240.0" y="196.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">承弣</text>
  <text x="430.0" y="200.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">弓把</text>
  <text x="80.0" y="278.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">授者：右手执梢，一手端</text>
  <text x="80.0" y="302.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">受者：由客之左，接下承弣，手在客手之下</text>
  <text x="80.0" y="326.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">注：「右客，尊之」「于堂上则俱南面，礼：敌者并授」</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　让客在右，让手在下：授受之礼，全在位置。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 主人自受</text>
</svg>