<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">亲馈则拜，不亲馈则不拜</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="60.0" y="110.0" width="290.0" height="140.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="205.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">主人亲馈</text>
  <text x="205.0" y="170.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">端送及己：多这一道手</text>
  <text x="205.0" y="206.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#994433" letter-spacing="0.4">拜而食</text>
  <rect x="410.0" y="110.0" width="290.0" height="140.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="555.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">主人不亲馈</text>
  <text x="555.0" y="170.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">礼于己不隆</text>
  <text x="555.0" y="206.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#994433" letter-spacing="0.4">不拜而食</text>
  <text x="60.0" y="282.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="10.0" fill="#25211D" letter-spacing="0.4">同是一盘菜：物同而意不同，则仪不同。</text>
  <text x="60.0" y="306.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">侍者不得执食兴辞——彼为降等之客，此为侍食者。</text>
  <text x="60.0" y="334.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">拜与不拜，都是给长者看的：劝长者食耳。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　人加一分意，我加一分敬；人不加，我不虚加。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 侍食于长者</text>
</svg>