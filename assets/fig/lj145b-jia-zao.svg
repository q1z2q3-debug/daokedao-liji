<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#7C6D5C"/></marker></defs><rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.8"/><rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.5"/><text x="380" y="52" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="15" fill="#25211D" text-anchor="middle" letter-spacing="3">家之所有：先要能祭</text><line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.2"/><rect x="160" y="140" width="170" height="60" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/><line x1="160" y1="200" x2="330" y2="200" stroke="#994433" stroke-width="1.4"/><text x="172" y="166" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="12" fill="#25211D" text-anchor="start" letter-spacing="0">祭器</text><text x="172" y="187" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9" fill="#7C6D5C" text-anchor="start" letter-spacing="0">崇敬祖祢</text><rect x="160" y="214" width="112" height="60" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/><text x="172" y="240" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="12" fill="#25211D" text-anchor="start" letter-spacing="0">牺赋</text><text x="172" y="261" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9" fill="#7C6D5C" text-anchor="start" letter-spacing="0">以税出牲</text><rect x="160" y="288" width="60" height="60" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/><text x="172" y="314" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="12" fill="#25211D" text-anchor="start" letter-spacing="0">养器</text><text x="172" y="335" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9" fill="#7C6D5C" text-anchor="s