<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#7C6D5C"/></marker></defs><rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.8"/><rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.5"/><text x="380" y="52" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="15" fill="#25211D" text-anchor="middle" letter-spacing="3">出去一步，回来两步</text><line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.2"/><line x1="330" y1="140" x2="330" y2="400" stroke="#7C6D5C" stroke-width="1.2"/><text x="330" y="130" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="10" fill="#7C6D5C" text-anchor="middle" letter-spacing="0">疆</text><path d="M182 250 L230 218 L278 250" stroke="#7C6D5C" stroke-width="1.1" fill="none"/><line x1="200" y1="250" x2="200" y2="300" stroke="#7C6D5C" stroke-width="1"/><line x1="260" y1="250" x2="260" y2="300" stroke="#7C6D5C" stroke-width="1"/><line x1="188" y1="300" x2="272" y2="300" stroke="#7C6D5C" stroke-width="1"/><text x="230" y="322" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="10" fill="#25211D" text-anchor="middle" letter-spacing="0">本国</text><path d="M278 268 L412 268" stroke="#7C6D5C" stroke-width="1" fill="none" marker-end="url(#ah)"/><text x="345" y="260" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9" fill="#7C6D5C" text-anchor="middle" letter-spacing="0">皆须请</text><path d="M412 340 L250 340" stroke="#994433" stroke-width="1" fill="none" marker-end="url(#ah)"/><path d="M412 362 L300 362" stroke="#9A9186" stroke-width="1" fill="none" marker-end="url(#ah)"/><rect x="334" y="318" width="18" height="18" fill="#F7F4EE" stroke="#994433" stroke-width="1"/><text x="444" y="344" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9" fill="#994433" text-anchor="start" letter-spacing="0">反必有献</text><text x="444" y="366" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9" fill="#9A9186" text-anchor="start" letter-spacing="0">反必告</text><text x="380" y="404" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9.5" fill="#7C6D5C" text-anchor="middle" letter-spacing="0">臣不敢自专</text><line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.8" stroke-dasharray="3,3"/><text x="70" y="470" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="13" fill="#25211D" text-anchor="start" letter-spacing="0">出亦请，反亦告；献则视位。</text><text x="700" y="486" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="11" fill="#25211D" text-anchor="middle" letter-spacing="0">图二 · 私行</text></svg>