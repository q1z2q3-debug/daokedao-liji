<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">四封之中，夫子取斧</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="100" y="174" width="92" height="156" fill="#DCD5C8" stroke="#7C6D5C" stroke-width="1.0"/>
<path d="M230,330 L246,278 L306,278 L322,330 Z" fill="#DCD5C8" stroke="#7C6D5C" stroke-width="1.0"/>
<path d="M360,330 L374,284 L438,284 L452,330 Z" fill="#DCD5C8" stroke="#7C6D5C" stroke-width="1.0"/>
<path d="M490,330 L508,240 L564,240 L582,330 Z" fill="#DCD5C8" stroke="#994433" stroke-width="1.4"/>
<line x1="90" y1="330" x2="594" y2="330" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="490" y1="330" x2="582" y2="330" stroke="#7C6D5C" stroke-width="1.2"/>
<text x="146" y="352" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">堂</text>
<text x="146" y="370" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">四方而高</text>
<text x="276" y="352" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">坊</text>
<text x="276" y="370" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">上平而长</text>
<text x="406" y="352" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">覆夏屋</text>
<text x="406" y="370" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">卑而广</text>
<text x="536" y="352" font-size="11" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">斧</text>
<text x="536" y="370" font-size="9" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">刃上而长</text>
<text x="598" y="246" font-size="10" fill="#994433" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">高四尺</text>
<text x="598" y="268" font-size="9" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">不敢过父</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">取斧之由不是象征，是刃上难登、狭而易为功</text>
</svg>