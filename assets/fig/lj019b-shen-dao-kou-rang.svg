<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="730" height="490" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="17" fill="#25211D" letter-spacing="3">身到，口讓</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="0.8"/>
  <rect x="52" y="124" width="150" height="58" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="127" y="158" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="14" fill="#25211D" letter-spacing="1">謀於長者</text>
  <line x1="208" y1="153" x2="240" y2="153" stroke="#994433" stroke-width="1"/>
  <polygon points="240,153 231,147 231,159" fill="#994433"/>
  <rect x="248" y="124" width="208" height="58" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="352" y="158" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="14" fill="#25211D" letter-spacing="1">必操几杖以從之</text>
  <line x1="462" y1="153" x2="494" y2="153" stroke="#994433" stroke-width="1"/>
  <polygon points="494,153 485,147 485,159" fill="#994433"/>
  <rect x="502" y="124" width="206" height="58" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="605" y="158" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="14" fill="#25211D" letter-spacing="1">從，猶就也：親往</text>
  <rect x="52" y="232" width="150" height="58" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="127" y="266" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="14" fill="#25211D" letter-spacing="1">長者問</text>
  <line x1="208" y1="261" x2="240" y2="261" stroke="#994433" stroke-width="1"/>
  <polygon points="240,261 231,255 231,267" fill="#994433"/>
  <rect x="248" y="232" width="208" height="58" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="352" y="266" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="14" fill="#25211D" letter-spacing="1">辭讓而對：謝不敏</text>
  <line x1="462" y1="261" x2="494" y2="261" stroke="#994433" stroke-width="1"/>
  <polygon points="494,261 485,255 485,267" fill="#994433"/>
  <rect x="502" y="232" width="206" height="58" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="605" y="266" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="14" fill="#25211D" letter-spacing="1">不讓而對，非禮</text>
  <text x="380" y="196" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="#7C6D5C" letter-spacing="2">身</text>
  <text x="380" y="304" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="#7C6D5C" letter-spacing="2">口</text>
  <line x1="52" y1="356" x2="708" y2="356" stroke="#994433" stroke-width="1"/>
  <text x="380" y="392" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="15" fill="#25211D" letter-spacing="3">身到，口讓</text>
  <text x="380" y="418" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C" letter-spacing="1">求教不是發問，是就</text>
  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186">图二 · 谋于长者　必操几杖 · lj019b</text>
</svg>
