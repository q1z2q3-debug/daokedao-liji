<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="730" height="490" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="17" fill="#25211D" letter-spacing="3">臨財　臨難　很　分</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="0.8"/>
  <rect x="70" y="110" width="130" height="84" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="135" y="150" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="18" fill="#25211D">財</text>
  <text x="135" y="170" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">毋苟得</text>
  <rect x="235" y="110" width="130" height="84" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="300" y="150" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="18" fill="#25211D">難</text>
  <text x="300" y="170" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">毋苟免</text>
  <rect x="400" y="110" width="130" height="84" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="465" y="150" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="18" fill="#25211D">勝</text>
  <text x="465" y="170" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">毋求勝</text>
  <rect x="565" y="110" width="130" height="84" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="630" y="150" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="18" fill="#25211D">分</text>
  <text x="630" y="170" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">毋求多</text>
  <rect x="300" y="248" width="170" height="46" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="385" y="269" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="14" fill="#25211D">廉　義　平</text>
  <line x1="135" y1="194" x2="342" y2="248" stroke="#994433" stroke-width="0.9"/>
  <line x1="300" y1="194" x2="362" y2="248" stroke="#994433" stroke-width="0.9"/>
  <line x1="465" y1="194" x2="398" y2="248" stroke="#994433" stroke-width="0.9"/>
  <line x1="630" y1="194" x2="428" y2="248" stroke="#994433" stroke-width="0.9"/>
  <text x="380" y="322" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="#994433" letter-spacing="1">所禁者皆一「苟」字</text>
  <line x1="52" y1="352" x2="708" y2="352" stroke="#994433" stroke-width="0.9"/>
  <text x="380" y="390" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="14" fill="#25211D" letter-spacing="2">不取其不當取　取其所當取　亦禮</text>
  <text x="380" y="420" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C" letter-spacing="1">鄭注：傷廉／傷義／傷平　｜　很，鬩也</text>
  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186">图二 · 临财毋苟得 · lj005b</text>
</svg>
