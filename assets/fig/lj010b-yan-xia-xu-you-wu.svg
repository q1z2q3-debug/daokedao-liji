<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="730" height="490" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="17" fill="#25211D" letter-spacing="3">言下須有物</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="0.8"/>
  <text x="200" y="116" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="18" fill="#7C6D5C" letter-spacing="4">言</text>
  <line x1="110" y1="150" x2="290" y2="150" stroke="#7C6D5C" stroke-width="0.8"/>
  <line x1="110" y1="171" x2="290" y2="171" stroke="#7C6D5C" stroke-width="0.8"/>
  <line x1="110" y1="192" x2="290" y2="192" stroke="#7C6D5C" stroke-width="0.8"/>
  <line x1="110" y1="213" x2="290" y2="213" stroke="#7C6D5C" stroke-width="0.8"/>
  <line x1="110" y1="234" x2="268" y2="234" stroke="#7C6D5C" stroke-width="0.8"/>
  <text x="300" y="236" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#994433" letter-spacing="1">多</text>
  <text x="560" y="116" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="18" fill="#7C6D5C" letter-spacing="4">行</text>
  <rect x="500" y="140" width="160" height="105" fill="none" stroke="#7C6D5C" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="580" y="200" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="20" fill="#7C6D5C" letter-spacing="2">空</text>
  <line x1="52" y1="292" x2="708" y2="292" stroke="#994433" stroke-width="0.9"/>
  <text x="380" y="328" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="15" fill="#25211D" letter-spacing="2">言多而行少，謂之費</text>
  <text x="380" y="358" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="#994433" letter-spacing="2">不以其道說之，是妄說</text>
  <text x="380" y="388" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C" letter-spacing="1">求以悅人，已失處心之正</text>
  <text x="380" y="414" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C" letter-spacing="1">達則止；達而未行，仍是費</text>
  <text x="380" y="444" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D" letter-spacing="2">言有物而行有格</text>
  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186">图二 · 不妄说人　不辞费 · lj010b</text>
</svg>
