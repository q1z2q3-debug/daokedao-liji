  <text x="260" y="328" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0.3">虽来讲问，犹以客礼待之，异于弟子</text>
  <circle cx="86" cy="354" r="3" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.7"/>
  <text x="100" y="358" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.5">客跪抚席而辞</text>
  <text x="260" y="358" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0.3">不敢当正</text>
