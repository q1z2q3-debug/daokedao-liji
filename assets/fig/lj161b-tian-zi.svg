<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#7C6D5C"/></marker></defs><rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.8"/><rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.5"/><text x="380" y="52" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="15" fill="#25211D" text-anchor="middle" letter-spacing="3">对外有分，对内有谦</text><line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.2"/><circle cx="380" cy="244" r="118" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/><circle cx="380" cy="244" r="74" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.8"/><circle cx="380" cy="244" r="4" fill="#994433"/><rect x="356" y="98" width="48" height="26" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/><path d="M380 124 L380 232" stroke="#7C6D5C" stroke-width="1" fill="none" marker-end="url(#ah)"/><text x="470" y="116" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9.5" fill="#25211D" text-anchor="start" letter-spacing="0">天子：外及四海</text><text x="470" y="300" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9.5" fill="#25211D" text-anchor="start" letter-spacing="0">予一人：人中之一人</text><path d="M348 280 L302 304" stroke="#7C6D5C" stroke-width="1" fill="none" marker-end="url(#ah)"/><circle cx="336" cy="322" r="2.5" fill="#9A9186"/><circle cx="348" cy="322" r="2.5" fill="#9A9186"/><circle cx="360" cy="322" r="2.5" fill="#9A9186"/><circle cx="372" cy="322" r="2.5" fill="#9A9186"/><text x="380" y="350" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9" fill="#9A9186" text-anchor="middle" letter-spacing="0">与物不殊</text><text x="380" y="404" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9.5" fill="#7C6D5C" text-anchor="middle" letter-spacing="0">称随所对：对着谁，就是谁</text><line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.8" stroke-dasharray="3,3"/><text x="70" y="470" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="13" fill="#25211D" text-anchor="start" letter-spacing="0">位愈高，愈要有一个能数进人群的称。</text><text x="700" y="486" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="11" fill="#25211D" text-anchor="middle" letter-spacing="0">图二 · 天子</text></svg>