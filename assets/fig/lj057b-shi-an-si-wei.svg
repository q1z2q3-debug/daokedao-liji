<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">一席四位：位以人为准</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="200.0" y="116.0" width="360.0" height="224.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <rect x="220.0" y="140.0" width="84.0" height="56.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="262.0" y="174.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#25211D" letter-spacing="0.4">殽</text>
  <rect x="456.0" y="140.0" width="84.0" height="56.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="498.0" y="174.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#25211D" letter-spacing="0.4">胾</text>
  <rect x="236.0" y="232.0" width="76.0" height="50.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="274.0" y="262.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#25211D" letter-spacing="0.4">食</text>
  <rect x="448.0" y="232.0" width="76.0" height="50.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="486.0" y="262.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#25211D" letter-spacing="0.4">羹</text>
  <circle cx="380" cy="308" r="5" fill="none" stroke="#994433" stroke-width="1"/>
  <text x="380.0" y="326.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">人坐处</text>
  <text x="60.0" y="140.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="11.0" fill="#7C6D5C" letter-spacing="0.4">左</text>
  <text x="700.0" y="140.0" text-anchor="end" font-family="Noto Serif CJK SC" font-size="11.0" fill="#7C6D5C" letter-spacing="0.4">右</text>
  <text x="60.0" y="176.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">殽：骨体，在俎</text>
  <text x="60.0" y="196.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">骨为阳</text>
  <text x="700.0" y="176.0" text-anchor="end" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">胾：切肉，在豆</text>
  <text x="700.0" y="196.0" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">肉为阴</text>
  <text x="60.0" y="258.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">食：饭属，燥</text>
  <text x="60.0" y="278.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">左手近之</text>
  <text x="700.0" y="258.0" text-anchor="end" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">羹：湿</text>
  <text x="700.0" y="278.0" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8.5" fill="#7C6D5C" letter-spacing="0.4">右手取便</text>
  <line x1="150.0" y1="190.0" x2="216.0" y2="168.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="209.0" y1="167.6" x2="216.0" y2="168.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="210.7" y1="172.5" x2="216.0" y2="168.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="700.0" y1="190.0" x2="544.0" y2="168.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="550.1" y1="171.5" x2="544.0" y2="168.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="550.8" y1="166.3" x2="544.0" y2="168.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="380.0" y="392.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.5" fill="#7C6D5C" letter-spacing="0.4">皆便食也：三便皆手之理，非心之理。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　四器左右的次序，算的是手，不是尊卑。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 左殽右胾</text>
</svg>