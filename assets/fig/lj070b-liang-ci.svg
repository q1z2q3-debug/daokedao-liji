<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">两辞皆优宾：尴尬移到主人身上</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="70.0" y="110.0" width="180.0" height="104.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="160.0" y="144.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">客絮羹</text>
  <text x="160.0" y="176.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">嫌主人味恶</text>
  <rect x="510.0" y="110.0" width="180.0" height="104.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="600.0" y="144.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">客歠醢</text>
  <text x="600.0" y="176.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">示其酱淡</text>
  <line x1="250.0" y1="162.0" x2="340.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="333.5" y1="159.4" x2="340.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="333.5" y1="164.6" x2="340.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="510.0" y1="162.0" x2="420.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="426.5" y1="164.6" x2="420.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="426.5" y1="159.4" x2="420.0" y2="162.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <rect x="340.0" y="132.0" width="80.0" height="60.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="380.0" y="168.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="13.0" fill="#994433" letter-spacing="0.4">辞</text>
  <text x="380.0" y="212.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">主人自贬，客便不必羞</text>
  <rect x="150.0" y="246.0" width="220.0" height="60.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="260.0" y="272.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">辞不能亨</text>
  <text x="260.0" y="292.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">我不会煮</text>
  <rect x="390.0" y="246.0" width="220.0" height="60.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="500.0" y="272.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">辞以窭</text>
  <text x="500.0" y="292.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">家里穷，酱淡</text>
  <line x1="340.0" y1="192.0" x2="262.0" y2="244.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="268.9" y1="242.6" x2="262.0" y2="244.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="266.0" y1="238.2" x2="262.0" y2="244.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="420.0" y1="192.0" x2="498.0" y2="244.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="494.0" y1="238.2" x2="498.0" y2="244.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="491.1" y1="242.6" x2="498.0" y2="244.0" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="60.0" y="344.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="10.0" fill="#25211D" letter-spacing="0.4">注：「优宾」——礼之所设，为使人安。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　把尴尬从客身上移到主人身上：所谓优宾，就是替人担。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 客絮羹</text>
</svg>