<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">三句诔辞：诔其行以为谥</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<line x1="96" y1="156" x2="96" y2="336" stroke="#994433" stroke-width="1.2"/>
<line x1="96" y1="156" x2="104" y2="156" stroke="#994433" stroke-width="1.2"/>
<line x1="96" y1="336" x2="104" y2="336" stroke="#994433" stroke-width="1.2"/>
<text x="80" y="250" font-size="13" fill="#994433" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">诔</text>
<text x="120" y="180" font-size="13" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">天不遗耆老</text>
<text x="340" y="180" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">怨天</text>
<text x="120" y="236" font-size="13" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">莫相予位焉</text>
<text x="340" y="236" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">自伤</text>
<text x="120" y="292" font-size="13" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">呜呼哀哉，尼父</text>
<text x="340" y="292" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">伤痛之辞</text>
<rect x="556" y="218" width="118" height="76" fill="#F7F4EE" stroke="#994433" stroke-width="1.2"/>
<text x="615" y="250" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">谥</text>
<text x="615" y="272" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">定其名</text>
<line x1="470" y1="256" x2="552" y2="256" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="380" y="372" font-size="11" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">诔：列其行　　谥：定其名</text>
<text x="380" y="396" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">孔子之德，此诔一字未及</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">君看臣，看到的是位</text>
</svg>