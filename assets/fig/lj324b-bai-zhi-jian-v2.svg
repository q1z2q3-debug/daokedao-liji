<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">白之渐：哀杀有渐</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="110" y="170" width="120" height="150" fill="#E2DACC" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="170" y="250" font-size="16" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">练</text>
<text x="170" y="340" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">小祥</text>
<rect x="250" y="170" width="120" height="150" fill="#EFE8DC" stroke="#994433" stroke-width="1.2"/>
<text x="310" y="250" font-size="16" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">缟</text>
<text x="310" y="340" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">大祥</text>
<rect x="390" y="170" width="120" height="150" fill="#FAF7F0" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="450" y="250" font-size="16" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">素</text>
<text x="450" y="340" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">禫</text>
<line x1="140" y1="356" x2="200" y2="356" stroke="#7C6D5C" stroke-width="1.0" marker-end="url(#ah)"/>
<line x1="280" y1="356" x2="340" y2="356" stroke="#7C6D5C" stroke-width="1.0" marker-end="url(#ah)"/>
<line x1="420" y1="356" x2="480" y2="356" stroke="#7C6D5C" stroke-width="1.0" marker-end="url(#ah)"/>
<line x1="560" y1="170" x2="560" y2="320" stroke="#7C6D5C" stroke-width="1.4"/>
<line x1="560" y1="232" x2="560" y2="262" stroke="#F7F4EE" stroke-width="5"/>
<text x="600" y="200" font-size="13" fill="#994433" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">乐</text>
<text x="600" y="224" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">徙月乃作</text>
<text x="600" y="250" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">禫月不许</text>
<text x="380" y="396" font-size="11" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">身可一日换衣，心不能一日换声</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">哀杀有渐，是以乐亦随之</text>
</svg>