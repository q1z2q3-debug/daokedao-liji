<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">哀有节：瘦可以，废事不可</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="70.0" y="100.0" width="120.0" height="52.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="130.0" y="132.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">五十</text>
  <text x="210.0" y="132.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">许毁，不许至极</text>
  <rect x="560.0" y="118.0" width="26.0" height="16.0" fill="#7C6D5C" stroke="#F7F4EE" stroke-width="0.6"/>
  <rect x="594.0" y="118.0" width="26.0" height="16.0" fill="#7C6D5C" stroke="#F7F4EE" stroke-width="0.6"/>
  <rect x="628.0" y="118.0" width="26.0" height="16.0" fill="#7C6D5C" stroke="#F7F4EE" stroke-width="0.6"/>
  <text x="660.0" y="132.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.5" fill="#9A9186" letter-spacing="0.4">哀之宽</text>
  <rect x="70.0" y="158.0" width="120.0" height="52.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="130.0" y="190.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">六十</text>
  <text x="210.0" y="190.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">不许毁</text>
  <rect x="560.0" y="176.0" width="26.0" height="16.0" fill="#7C6D5C" stroke="#F7F4EE" stroke-width="0.6"/>
  <rect x="594.0" y="176.0" width="26.0" height="16.0" fill="#7C6D5C" stroke="#F7F4EE" stroke-width="0.6"/>
  <text x="660.0" y="190.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.5" fill="#9A9186" letter-spacing="0.4">哀之宽</text>
  <rect x="70.0" y="216.0" width="120.0" height="52.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="130.0" y="248.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">七十</text>
  <text x="210.0" y="248.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">唯衰麻在身，饮酒食肉处于内</text>
  <rect x="560.0" y="234.0" width="26.0" height="16.0" fill="#7C6D5C" stroke="#F7F4EE" stroke-width="0.6"/>
  <text x="660.0" y="248.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.5" fill="#9A9186" letter-spacing="0.4">哀之宽</text>
  <line x1="70.0" y1="282.0" x2="700.0" y2="282.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="310.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">有疾则饮酒食肉，疾止复初；不胜丧，乃比于不慈不孝。</text>
  <text x="80.0" y="336.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">不由阼阶、不当门隧：常若亲存；毁瘠不形：许瘦不许骨露。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　礼之年，就是礼之宽；哀不废生。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 居丧之礼</text>
</svg>