<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">主未遍，客不先：一席之终仍待人</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="80.0" y="130.0" width="190.0" height="210.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="175.0" y="158.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">主人</text>
  <rect x="430.0" y="130.0" width="190.0" height="210.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="525.0" y="158.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">客</text>
  <rect x="120.0" y="272.0" width="110.0" height="16.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <rect x="130.0" y="288.0" width="90.0" height="10.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="175.0" y="320.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">殽未尽</text>
  <ellipse cx="525" cy="290" rx="26" ry="10" fill="none" stroke="#7C6D5C" stroke-width="1"/>
  <text x="525.0" y="320.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">已虚口</text>
  <line x1="360.0" y1="130.0" x2="360.0" y2="340.0" stroke="#DCD5C8" stroke-width="0.9" stroke-dasharray="4,4"/>
  <line x1="430.0" y1="250.0" x2="372.0" y2="250.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="378.5" y1="252.6" x2="372.0" y2="250.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="378.5" y1="247.4" x2="372.0" y2="250.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="365.0" y1="241.0" x2="383.0" y2="259.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="383.0" y1="241.0" x2="365.0" y2="259.0" stroke="#7C6D5C" stroke-width="1.2"/>
  <text x="360.0" y="232.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">不先</text>
  <text x="60.0" y="372.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">虚口＝酳：以酒演养其气；漱用浆，酳用酒。</text>
  <text x="60.0" y="394.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">俟主人：待的不是饭，是人。</text>
  <text x="60.0" y="416.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">敌客以上，其酳不待主人饱——礼随分而变。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　最容易松手的时候，仍不松手。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 主人未辩</text>
</svg>