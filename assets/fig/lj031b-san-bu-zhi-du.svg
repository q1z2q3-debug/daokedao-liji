  <text x="368" y="286" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="1">各成其迹</text>
  <text x="368" y="304" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="1">不半相蹑</text>
  <rect x="488" y="110" width="212" height="254" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="502" y="130" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10" fill="#994433" letter-spacing="1.5">三不趋</text>
  <text x="502" y="160" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10" fill="#25211D" letter-spacing="1">帷薄之外</text>
  <text x="502" y="178" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.5">不见尊者，不为容</text>
  <line x1="502" y1="188" x2="686" y2="188" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="502" y="224" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10" fill="#25211D" letter-spacing="1">堂上</text>
  <text x="502" y="242" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.5">地狭有陈，趋则易碰</text>
  <line x1="502" y1="252" x2="686" y2="252" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="502" y="288" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10" fill="#25211D" letter-spacing="1">执玉</text>
  <text x="502" y="306" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.5">手有所执，趋则易失</text>
  <line x1="502" y1="316" x2="686" y2="316" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="86" y="388" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.5">室中不翔，并坐不横肱：不占他人之地</text>
  <text x="86" y="410" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.5">授立不跪，授坐不立：不敢以长临之</text>
  <line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="1"/>
  <text x="380" y="468" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D" letter-spacing="2">快慢看场域，舒展看邻人</text>
