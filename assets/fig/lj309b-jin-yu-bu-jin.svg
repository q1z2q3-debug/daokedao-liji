<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">盖不盖，看案上是什么</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<path d="M130,250 Q200,320 270,250 Z" fill="#DCD5C8" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="122" y1="246" x2="278" y2="246" stroke="#994433" stroke-width="1.4"/>
<line x1="126" y1="246" x2="126" y2="268" stroke="#994433" stroke-width="1.0"/>
<line x1="274" y1="246" x2="274" y2="268" stroke="#994433" stroke-width="1.0"/>
<text x="200" y="344" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">有牲肉</text>
<path d="M450,250 Q520,320 590,250 Z" fill="#DCD5C8" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="520" y="344" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">脯醢</text>
<text x="200" y="366" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">则巾之</text>
<text x="520" y="366" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">则不巾</text>
<text x="380" y="130" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">同一脯醢，在室不巾，在堂则巾——为其在堂，恐埃尘</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">礼之大半，是先解决会不会脏，再说合不合敬</text>
</svg>