<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">荐新之礼，比照朔奠</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="120" y="128" width="520" height="44" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="160" y="156" font-size="12" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">朔奠</text>
<text x="240" y="156" font-size="9" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">特豚三鼎，牲馔丰</text>
<text x="624" y="156" font-size="9" fill="#7C6D5C" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">殷奠</text>
<rect x="120" y="232" width="520" height="44" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="160" y="260" font-size="12" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">荐新</text>
<text x="240" y="260" font-size="9" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">新谷初熟，一盂一盘</text>
<text x="624" y="260" font-size="9" fill="#7C6D5C" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">时物</text>
<line x1="380" y1="176" x2="380" y2="228" stroke="#994433" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="396" y="206" font-size="12" fill="#994433" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">如</text>
<text x="396" y="224" font-size="9" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">规格相等</text>
<line x1="660" y1="118" x2="660" y2="300" stroke="#9A9186" stroke-width="0.9" stroke-dasharray="4,4"/>
<text x="660" y="322" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">未葬</text>
<text x="120" y="300" font-size="11" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">所告者重，其礼不得不重</text>
<text x="120" y="322" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">额外之事，最易苟简</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">荐新的对象不是食物，是「时间走到了这一步」</text>
</svg>