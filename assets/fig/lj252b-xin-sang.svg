<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">服可无，心不可无</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="120" y="168" width="150" height="56" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0" stroke-dasharray="5,4"/>
<text x="195" y="202" font-size="10.5" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">衰（不为）</text>
<line x1="189" y1="190" x2="201" y2="202" stroke="#994433" stroke-width="1.2"/>
<line x1="189" y1="202" x2="201" y2="190" stroke="#994433" stroke-width="1.2"/>
<text x="195" y="262" font-size="9.5" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">外无可识之服</text>
<rect x="120" y="300" width="150" height="40" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="195" y="326" font-size="10.5" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">吊服加麻</text>
<text x="195" y="366" font-size="9.5" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">绖与带，可去</text>
<line x1="310" y1="240" x2="640" y2="240" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="310" y1="240" x2="310" y2="216" stroke="#DCD5C8" stroke-width="1.0"/>
<text x="310" y="204" font-size="9.5" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">葬</text>
<text x="640" y="204" font-size="9.5" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">三年</text>
<circle cx="475" cy="240" r="5" fill="#994433"/>
<text x="475" y="222" font-size="10" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">心丧</text>
<text x="475" y="264" font-size="9.5" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">内不可见</text>
<text x="380" y="400" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">无丧师之礼，若丧父而无服</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">外有一层麻，内有三年之心</text>
</svg>