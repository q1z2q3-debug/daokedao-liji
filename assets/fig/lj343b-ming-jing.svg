<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">铭与重：识与依</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<line x1="400" y1="160" x2="400" y2="420" stroke="#7C6D5C" stroke-width="1.4"/>
<path d="M400,168 L520,190 L512,330 L400,342 Z" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.2"/>
<line x1="430" y1="210" x2="430" y2="300" stroke="#994433" stroke-width="2.2"/>
<text x="466" y="322" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">铭</text>
<line x1="300" y1="300" x2="300" y2="420" stroke="#7C6D5C" stroke-width="1.2"/>
<line x1="282" y1="300" x2="318" y2="300" stroke="#7C6D5C" stroke-width="1.4"/>
<line x1="282" y1="340" x2="318" y2="340" stroke="#9A9186" stroke-width="1.0"/>
<text x="300" y="388" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">重</text>
<text x="300" y="264" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">主道也</text>
<text x="180" y="250" font-size="10" fill="#7C6D5C" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">名与等，皆在此一旗</text>
<text x="380" y="434" font-size="10" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">爱之则录其神，敬之则尽其道</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">认不出他了，故以旗再举其名</text>
</svg>