  <text x="165" y="165" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">彼己俱疑</text>
  <rect x="80" y="262" width="170" height="74" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="165" y="297" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="17" fill="#25211D">毋質</text>
  <text x="165" y="317" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">不成言之</text>
  <line x1="165" y1="184" x2="165" y2="262" stroke="#994433" stroke-width="0.9"/>
  <text x="196" y="228" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C" letter-spacing="1">傷知</text>
  <rect x="430" y="110" width="170" height="74" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="515" y="145" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="15" fill="#25211D">直</text>
  <text x="515" y="165" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">正也</text>
  <rect x="430" y="262" width="170" height="74" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="515" y="297" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="16" fill="#25211D">勿有</text>
  <text x="515" y="317" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C">稱師友以正之</text>
  <line x1="515" y1="184" x2="515" y2="262" stroke="#994433" stroke-width="0.9"/>
  <text x="546" y="228" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C" letter-spacing="1">勿據為己</text>
  <text x="380" y="348" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="#994433" letter-spacing="2">一止　一讓</text>
  <line x1="52" y1="376" x2="708" y2="376" stroke="#994433" stroke-width="0.9"/>
  <text x="380" y="412" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="14" fill="#25211D" letter-spacing="2">未知者留白　已知者說出來處</text>
  <text x="380" y="440" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10.5" fill="#7C6D5C" letter-spacing="1">疑則問，不禁求其實　｜　歸功非推責</text>
  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186">图二 · 疑事毋质 · lj006b</text>
