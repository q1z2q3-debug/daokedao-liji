<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="730" height="490" fill="#DCD5C8"/>
  <rect x="16" y="16" width="728" height="488" fill="#DCD5C8"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="17" fill="#25211D" letter-spacing="3">听言之三戒：不插、不散、不慢</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="0.8"/>
  <rect x="60" y="116" width="540" height="56" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <text x="80" y="140" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.4">长者正论甲事</text>
  <line x1="80" y1="156" x2="300" y2="156" stroke="#7C6D5C" stroke-width="1.2"/>
  <text x="310" y="150" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">未及乙事</text>
  <line x1="300" y1="146" x2="300" y2="166" stroke="#7C6D5C" stroke-width="0.8"/>
  <rect x="300" y="188" width="200" height="34" fill="#F7F4EE" stroke="#994433" stroke-width="1"/>
  <text x="400" y="210" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="0.4">少者以乙事杂之</text>
  <line x1="400" y1="176" x2="400" y2="188" stroke="#994433" stroke-width="1.2"/>
  <line x1="400" y1="188" x2="396.644" y2="181.857" stroke="#994433" stroke-width="1.2"/>
  <line x1="400" y1="188" x2="403.356" y2="181.857" stroke="#994433" stroke-width="1.2"/>
  <line x1="517" y1="198" x2="531" y2="212" stroke="#994433" stroke-width="1.4"/>
  <line x1="517" y1="212" x2="531" y2="198" stroke="#994433" stroke-width="1.4"/>
  <text x="546" y="200" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.4">儳言</text>
  <text x="546" y="218" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">儳犹暂也，非类杂</text>
  <line x1="60" y1="244" x2="700" y2="244" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="86" y="270" text-anchor="start" font-family="Noto Serif SC,serif" font-size="10" fill="#25211D" letter-spacing="1">两个要求</text>
  <text x="86" y="296" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#994433" letter-spacing="0.4">正尔容：方受先生之道，当正己矜庄</text>
  <text x="86" y="320" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#994433" letter-spacing="0.4">听必恭：既说又敬——听懂了仍须敬</text>
  <line x1="86" y1="338" x2="660" y2="338" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="86" y="364" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0.4">所禁者不在问，在「杂」；不问则哑，杂则乱。</text>
  <text x="86" y="386" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0.4">界线画在长者说到哪里，不在你知道多少。</text>
  <text x="86" y="412" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9" fill="#994433" letter-spacing="0.4">《论语》：言未及之而言，谓之躁。</text>
  <line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="1"/>
  <text x="380" y="468" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D" letter-spacing="2">口收在长者的话里</text>
  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186" letter-spacing="1">图二 · 听言之三戒：不插、不散、不慢 · lj036b</text>
</svg>
