<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">以位代言，不斥而斥</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<line x1="70" y1="208" x2="690" y2="208" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="86" y="200" font-size="9" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">堂上</text>
<rect x="330" y="150" width="86" height="36" fill="#F7F4EE" stroke="#994433" stroke-width="1.2"/>
<text x="373" y="174" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">適子南面</text>
<text x="320" y="172" font-size="9" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">文子亲扶</text>
<text x="426" y="172" font-size="9" fill="#7C6D5C" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">虎也敢不復位</text>
<text x="80" y="246" font-size="9" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">宾位·近北</text>
<rect x="180" y="254" width="64" height="24" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.9"/>
<rect x="260" y="254" width="64" height="24" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.9"/>
<rect x="340" y="254" width="64" height="24" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.9"/>
<text x="80" y="316" font-size="9" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">家臣·近门南</text>
<rect x="180" y="324" width="64" height="24" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.9"/>
<rect x="260" y="324" width="64" height="24" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.9"/>
<rect x="340" y="324" width="64" height="24" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.9"/>
<line x1="212" y1="282" x2="212" y2="320" stroke="#994433" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="470" y="220" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">三辞三请</text>
<text x="470" y="252" font-size="10" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">一辞——止其服</text>
<text x="470" y="284" font-size="10" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">再辞——止其位</text>
<text x="470" y="316" font-size="10" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">三辞——扶適子</text>
<text x="380" y="382" font-size="11" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">子游未出一言</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">位一降，適子不在位自见</text>
</svg>