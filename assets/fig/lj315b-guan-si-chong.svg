<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">四重五物：等以整层为差</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<text x="380" y="104" font-size="11" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">天子之棺四重　合二尺四寸</text>
<rect x="180" y="120" width="280" height="80" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.4"/>
<text x="310" y="165" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">大棺</text>
<text x="470" y="164" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">八寸</text>
<rect x="180" y="200" width="280" height="60" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="310" y="235" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">属</text>
<text x="470" y="234" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">六寸</text>
<rect x="180" y="260" width="280" height="40" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="310" y="285" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">杝（椑）</text>
<text x="470" y="284" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">四寸</text>
<rect x="180" y="300" width="280" height="30" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="310" y="320" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">兕革</text>
<text x="470" y="319" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">三寸</text>
<rect x="180" y="330" width="280" height="30" fill="#F7F4EE" stroke="#994433" stroke-width="1.2"/>
<text x="310" y="350" font-size="11" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">水革</text>
<text x="470" y="349" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">三寸</text>
<line x1="180" y1="360" x2="460" y2="360" stroke="#7C6D5C" stroke-width="1.6"/>
<text x="310" y="382" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">自内而外：皮二、杝、属、大棺</text>
<text x="560" y="130" font-size="11" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">五等之差</text>
<line x1="560" y1="140" x2="690" y2="140" stroke="#994433" stroke-width="1.0"/>
<text x="560" y="166" font-size="11" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">上公　三重</text>
<text x="690" y="166" font-size="9" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">去水牛</text>
<text x="560" y="196" font-size="11" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">诸侯　再重</text>
<text x="690" y="196" font-size="9" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">去兕</text>
<text x="560" y="226" font-size="11" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">大夫　一重</text>
<text x="690" y="226" font-size="9" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">去杝</text>
<text x="560" y="256" font-size="11" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">士　　不重</text>
<text x="690" y="256" font-size="9" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">去属·唯大棺</text>
<text x="560" y="306" font-size="11" fill="#7C6D5C" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">去一层，降一等</text>
<text x="560" y="328" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">层不可拆，故无可争</text>
<text x="560" y="366" font-size="10" fill="#9A9186" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">士六寸，庶人四寸</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">以层为等，不以数为等</text>
</svg>