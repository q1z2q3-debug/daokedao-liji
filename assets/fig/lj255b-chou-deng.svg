<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">仇有轻重，报有等差</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<text x="252" y="166" font-size="11" fill="#25211D" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">父母之仇</text>
<line x1="262" y1="162" x2="470" y2="162" stroke="#DCD5C8" stroke-width="0.9"/>
<text x="478" y="166" font-size="9" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">寝苫枕干·不仕·不共天下·不反兵而斗</text>
<text x="196" y="166" font-size="9.5" fill="#994433" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">一等</text>
<text x="252" y="250" font-size="11" fill="#25211D" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">昆弟之仇</text>
<line x1="262" y1="246" x2="470" y2="246" stroke="#DCD5C8" stroke-width="0.9"/>
<text x="478" y="250" font-size="9" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">仕不共国·衔命使遇则不斗</text>
<text x="196" y="250" font-size="9.5" fill="#994433" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">二等</text>
<text x="252" y="334" font-size="11" fill="#25211D" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">从父昆弟</text>
<line x1="262" y1="330" x2="470" y2="330" stroke="#DCD5C8" stroke-width="0.9"/>
<text x="478" y="334" font-size="9" fill="#25211D" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">不为魁·主人能则陪其后</text>
<text x="196" y="334" font-size="9.5" fill="#994433" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">三等</text>
<text x="380" y="396" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">亲愈近，则报愈重，让愈少</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">等定而后厚薄有所据</text>
</svg>