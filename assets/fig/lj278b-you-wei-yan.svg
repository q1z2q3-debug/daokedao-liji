<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">一言必有其地</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="80" y="96" width="280" height="200" fill="#F7F4EE" stroke="#DCD5C8" stroke-width="0.9"/>
<text x="220" y="118" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">桓司马之庭</text>
<rect x="180" y="140" width="80" height="44" fill="#F7F4EE" stroke="#994433" stroke-width="1.2"/>
<text x="220" y="168" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">死欲速朽</text>
<text x="220" y="216" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">石椁三年不成</text>
<text x="220" y="236" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">靡也</text>
<rect x="400" y="96" width="280" height="200" fill="#F7F4EE" stroke="#DCD5C8" stroke-width="0.9"/>
<text x="540" y="118" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">敬叔之朝</text>
<rect x="500" y="140" width="80" height="44" fill="#F7F4EE" stroke="#994433" stroke-width="1.2"/>
<text x="540" y="168" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">丧欲速贫</text>
<text x="540" y="216" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">载宝而朝</text>
<text x="540" y="236" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">货也</text>
<line x1="240" y1="330" x2="400" y2="330" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<rect x="180" y="306" width="60" height="26" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="210" y="324" font-size="9" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">四寸五寸</text>
<rect x="400" y="306" width="100" height="26" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="450" y="324" font-size="9" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">先子夏申冉有</text>
<text x="380" y="366" font-size="11" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">以夫子之行事，证夫子之言语</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">一句真话，离开它的地方就成了假话</text>
</svg>