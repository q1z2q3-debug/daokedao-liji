<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="730" height="490" fill="#DCD5C8"/>
  <rect x="16" y="16" width="728" height="488" fill="#DCD5C8"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="17" fill="#25211D" letter-spacing="3">前后之位：谦与污</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="0.8"/>
  <text x="200" y="138" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="#25211D" letter-spacing="1.2">虚坐尽后</text>
  <rect x="80" y="150" width="240" height="120" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <rect x="96" y="214" width="72" height="40" fill="#F7F4EE" stroke="#994433" stroke-width="1"/>
  <text x="132" y="238" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10" fill="#994433" letter-spacing="1">坐</text>
  <text x="132" y="196" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">席端留空</text>
  <text x="200" y="290" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0.4">不敢近前，以为谦</text>
  <text x="540" y="138" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="#25211D" letter-spacing="1.2">食坐尽前</text>
  <rect x="420" y="150" width="240" height="120" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <rect x="432" y="158" width="32" height="14" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <rect x="488" y="158" width="32" height="14" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <rect x="544" y="158" width="32" height="14" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <rect x="600" y="158" width="32" height="14" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1"/>
  <rect x="500" y="196" width="80" height="44" fill="#F7F4EE" stroke="#994433" stroke-width="1"/>
  <text x="540" y="222" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="10" fill="#994433" letter-spacing="1">坐</text>
  <text x="540" y="290" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="9" fill="#7C6D5C" letter-spacing="0.4">俎豆陈前，坐后则溅污席</text>
  <line x1="340" y1="210" x2="410" y2="210" stroke="#994433" stroke-width="1.2"/>
  <line x1="410" y1="210" x2="403.857" y2="213.356" stroke="#994433" stroke-width="1.2"/>
  <line x1="410" y1="210" x2="403.857" y2="206.644" stroke="#994433" stroke-width="1.2"/>
  <text x="375" y="200" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="8.5" fill="#9A9186" letter-spacing="0.3">同位</text>
  <line x1="60" y1="312" x2="700" y2="312" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="86" y="336" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#25211D" letter-spacing="0.4">无事则后，是让；有事则前，是防。</text>
  <text x="86" y="362" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#994433" letter-spacing="0.4">坐必安：凡坐好自摇动，故戒之。</text>
  <text x="86" y="384" text-anchor="start" font-family="Noto Serif SC,serif" font-size="9.5" fill="#994433" letter-spacing="0.4">执尔颜：执犹守也，久坐不作颜容。</text>
  <text x="86" y="408" text-anchor="start" font-family="Noto Serif SC,serif" font-size="8.5" fill="#7C6D5C" letter-spacing="0.3">《玉藻》：徒坐不尽席尺；食则齐豆去席尺。</text>
  <line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="1"/>
  <text x="380" y="468" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" fill="#25211D" letter-spacing="2">位置看事，安稳看心</text>
  <text x="708" y="486" text-anchor="end" font-family="Noto Serif SC,serif" font-size="9.5" fill="#9A9186" letter-spacing="1">图二 · 前后之位：谦与污 · lj035b</text>
</svg>
