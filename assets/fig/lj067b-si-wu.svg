<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">四戒：所防者，主人之疑</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="60.0" y="110.0" width="170.0" height="100.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="145.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">毋咤食</text>
  <text x="145.0" y="194.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">似嫌主人之食</text>
  <rect x="220.0" y="110.0" width="170.0" height="100.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="305.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">毋齧骨</text>
  <text x="305.0" y="194.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">有声｜嫌无肉</text>
  <rect x="380.0" y="110.0" width="170.0" height="100.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="465.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">毋反鱼肉</text>
  <text x="465.0" y="194.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">已历口，人所秽</text>
  <rect x="540.0" y="110.0" width="170.0" height="100.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="625.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11.0" fill="#25211D" letter-spacing="0.4">毋投与狗骨</text>
  <text x="625.0" y="194.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.5" fill="#994433" letter-spacing="0.4">贱主人之食</text>
  <text x="380.0" y="246.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.0" fill="#7C6D5C" letter-spacing="0.4">四条所护者一事：不使主人一刻自疑待客不周。</text>
  <text x="60.0" y="296.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">齧骨三嫌：声也，无肉也，口唇可憎也。</text>
  <text x="60.0" y="322.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#25211D" letter-spacing="0.4">反鱼肉与「毋放饭」同一理：已历口者不入公器。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　礼先管声：声最易被听成评断。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 毋咤食</text>
</svg>