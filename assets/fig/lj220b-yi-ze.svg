<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">爱以德，不以姑息</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<line x1="150" y1="300" x2="150" y2="132" stroke="#7C6D5C" stroke-width="1.4"/>
<line x1="150" y1="148" x2="150" y2="132" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="150" y="118" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">以德：正</text>
<text x="150" y="322" font-size="10" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">得正而毙</text>
<path d="M600,132 C628,196 572,238 600,300" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.4"/>
<text x="600" y="118" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">以姑息：苟安</text>
<text x="600" y="322" font-size="10" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">幸而至于旦</text>
<rect x="322" y="250" width="116" height="26" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.2"/>
<text x="380" y="268" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">箦</text>
<text x="380" y="240" font-size="9.5" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">华而睆，大夫之箦</text>
<line x1="380" y1="340" x2="380" y2="284" stroke="#7C6D5C" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="398" y="332" font-size="10" fill="#7C6D5C" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">举扶而易之</text>
<line x1="300" y1="360" x2="460" y2="360" stroke="#DCD5C8" stroke-width="0.7"/>
<text x="380" y="380" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">反席未安而没</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">君子爱人以德，细人爱人以姑息</text>
</svg>