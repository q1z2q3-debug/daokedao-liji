<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">亲与恩：两把尺</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<text x="70" y="132" font-size="12" fill="#7C6D5C" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">第一把　亲</text>
<line x1="110" y1="175" x2="640" y2="175" stroke="#7C6D5C" stroke-width="2.0"/>
<line x1="110" y1="167" x2="110" y2="183" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="176" y1="167" x2="176" y2="183" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="242" y1="167" x2="242" y2="183" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="308" y1="167" x2="308" y2="183" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="374" y1="167" x2="374" y2="183" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="440" y1="167" x2="440" y2="183" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="506" y1="167" x2="506" y2="183" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="572" y1="167" x2="572" y2="183" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="638" y1="167" x2="638" y2="183" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="110" y1="175" x2="300" y2="175" stroke="#994433" stroke-width="2.6"/>
<text x="205" y="203" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">远兄弟，虽缌必往</text>
<text x="205" y="220" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">服最轻，亲不可减</text>
<line x1="400" y1="175" x2="620" y2="175" stroke="#7C6D5C" stroke-width="2.6"/>
<line x1="505" y1="170" x2="515" y2="180" stroke="#994433" stroke-width="1.2"/>
<line x1="505" y1="180" x2="515" y2="170" stroke="#994433" stroke-width="1.2"/>
<text x="510" y="205" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">非兄弟，虽邻不往</text>
<text x="510" y="222" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">近而不亲，不以近充亲</text>
<text x="70" y="268" font-size="12" fill="#7C6D5C" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">第二把　恩</text>
<line x1="110" y1="310" x2="640" y2="310" stroke="#7C6D5C" stroke-width="2.0"/>
<line x1="110" y1="302" x2="110" y2="318" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="176" y1="302" x2="176" y2="318" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="242" y1="302" x2="242" y2="318" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="308" y1="302" x2="308" y2="318" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="374" y1="302" x2="374" y2="318" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="440" y1="302" x2="440" y2="318" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="506" y1="302" x2="506" y2="318" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="572" y1="302" x2="572" y2="318" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="638" y1="302" x2="638" y2="318" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="110" y1="310" x2="330" y2="310" stroke="#994433" stroke-width="2.6"/>
<text x="220" y="338" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">所识，其兄弟不同居者皆吊</text>
<text x="220" y="355" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">吊的不是死者，是其兄弟</text>
<text x="480" y="338" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">成死者之恩旧</text>
<text x="70" y="392" font-size="11" fill="#7C6D5C" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">先问是不是骨肉；不是，再问有没有旧恩</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">两样都没有，就不去——不去不是无情，是不冒充</text>
</svg>