<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="508" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#25211D" letter-spacing="3">四避一由：名终将讳之</text>
  <line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1"/>
  <rect x="72.0" y="110.0" width="136.0" height="86.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="140.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#25211D" letter-spacing="0.4">国</text>
  <line x1="130.0" y1="158.0" x2="150.0" y2="178.0" stroke="#7C6D5C" stroke-width="1.3"/>
  <line x1="150.0" y1="158.0" x2="130.0" y2="178.0" stroke="#7C6D5C" stroke-width="1.3"/>
  <text x="140.0" y="214.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">本国国名</text>
  <rect x="212.0" y="110.0" width="136.0" height="86.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="280.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#25211D" letter-spacing="0.4">日月</text>
  <line x1="270.0" y1="158.0" x2="290.0" y2="178.0" stroke="#7C6D5C" stroke-width="1.3"/>
  <line x1="290.0" y1="158.0" x2="270.0" y2="178.0" stroke="#7C6D5C" stroke-width="1.3"/>
  <text x="280.0" y="214.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">甲乙丙丁</text>
  <rect x="352.0" y="110.0" width="136.0" height="86.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="420.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#25211D" letter-spacing="0.4">隐疾</text>
  <line x1="410.0" y1="158.0" x2="430.0" y2="178.0" stroke="#7C6D5C" stroke-width="1.3"/>
  <line x1="430.0" y1="158.0" x2="410.0" y2="178.0" stroke="#7C6D5C" stroke-width="1.3"/>
  <text x="420.0" y="214.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">衣中之疾</text>
  <rect x="492.0" y="110.0" width="136.0" height="86.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="560.0" y="140.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12.0" fill="#25211D" letter-spacing="0.4">山川</text>
  <line x1="550.0" y1="158.0" x2="570.0" y2="178.0" stroke="#7C6D5C" stroke-width="1.3"/>
  <line x1="570.0" y1="158.0" x2="550.0" y2="178.0" stroke="#7C6D5C" stroke-width="1.3"/>
  <text x="560.0" y="214.0" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">废主之祀</text>
  <line x1="340.0" y1="228.0" x2="340.0" y2="262.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="342.6" y1="255.5" x2="340.0" y2="262.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="337.4" y1="255.5" x2="340.0" y2="262.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <rect x="60.0" y="266.0" width="600.0" height="56.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="80.0" y="290.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="10.5" fill="#25211D" letter-spacing="0.4">为后难讳：名在常语之中，避之不胜避。</text>
  <text x="80.0" y="310.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#7C6D5C" letter-spacing="0.4">《春秋传》曰：「名，终将讳之。」</text>
  <rect x="60.0" y="350.0" width="300.0" height="74.0" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="76.0" y="374.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="10.0" fill="#25211D" letter-spacing="0.4">五法：信、义、象、假、类</text>
  <text x="76.0" y="398.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#994433" letter-spacing="0.4">四避之外，五法是路。</text>
  <text x="76.0" y="414.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.0" fill="#7C6D5C" letter-spacing="0.4">禁其不可，正为其可者留地。</text>
  <line x1="370.0" y1="382.0" x2="420.0" y2="382.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="413.5" y1="379.4" x2="420.0" y2="382.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="413.5" y1="384.6" x2="420.0" y2="382.0" stroke="#7C6D5C" stroke-width="1.1"/>
  <text x="430.0" y="378.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#25211D" letter-spacing="0.4">黑臀、黑肱：</text>
  <text x="430.0" y="396.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#7C6D5C" letter-spacing="0.4">违礼而得名，</text>
  <text x="430.0" y="414.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="9.5" fill="#7C6D5C" letter-spacing="0.4">非合礼之例。</text>
  <line x1="60.0" y1="444.0" x2="700.0" y2="444.0" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="80.0" y="468.0" text-anchor="start" font-family="Noto Serif CJK SC" font-size="13.0" fill="#25211D" letter-spacing="0.6">结论　今日之名，他日之讳：取名先问「日后避得开否」。</text>
  <text x="700" y="486" text-anchor="end" font-family="Noto Serif CJK SC" font-size="8" fill="#9A9186" letter-spacing="0.6">图二 · 名子者不以国</text>
</svg>