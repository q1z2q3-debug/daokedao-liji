<text x="196" y="150" font-size="11" fill="#25211D" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">天子·牺牛</text>
<text x="196" y="165" font-size="9" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">纯毛，涤三月</text>
<rect x="210" y="212" width="390" height="20" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="210" y1="212" x2="210" y2="232" stroke="#994433" stroke-width="1.6"/>
<text x="196" y="220" font-size="11" fill="#25211D" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">诸侯·肥牛</text>
<text x="196" y="235" font-size="9" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">养于涤三月</text>
<rect x="210" y="282" width="30" height="20" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="210" y1="282" x2="210" y2="302" stroke="#994433" stroke-width="1.6"/>
<text x="196" y="290" font-size="11" fill="#25211D" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">大夫·索牛</text>
<text x="196" y="305" font-size="9" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">求得即用</text>
<rect x="210" y="352" width="40" height="20" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<line x1="210" y1="352" x2="210" y2="372" stroke="#994433" stroke-width="1.6"/>
<text x="196" y="360" font-size="11" fill="#25211D" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">士·羊豕</text>
<text x="196" y="375" font-size="9" fill="#9A9186" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">羊豕，不过十日</text>
<line x1="236" y1="134" x2="636" y2="134" stroke="#994433" stroke-width="1.2"/>
<text x="644" y="132" font-size="9" fill="#994433" text-anchor="start" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">纯毛之择</text>
<text x="380" y="398" font-size="11" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">上得兼下，下不得僣上</text>
<text x="380" y="418" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">长者为备久，短者为备促</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">规格的差别，常常就是准备时间的差别</text>
</svg>