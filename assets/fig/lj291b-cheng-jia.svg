<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">上有节，下有三条</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<line x1="100" y1="180" x2="680" y2="180" stroke="#994433" stroke-width="1.4"/>
<text x="680" y="172" font-size="10" fill="#994433" text-anchor="end" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">毋过礼</text>
<line x1="100" y1="200" x2="680" y2="200" stroke="#9A9186" stroke-width="0.9" stroke-dasharray="2,5"/>
<text x="380" y="246" font-size="10" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">各家之力，礼不再管</text>
<rect x="120" y="300" width="150" height="34" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="195" y="323" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">敛首足形</text>
<rect x="300" y="300" width="150" height="34" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="375" y="323" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">还葬</text>
<rect x="470" y="300" width="150" height="34" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="545" y="323" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">县棺而封</text>
<text x="380" y="372" font-size="11" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">这三条做到，人岂有非之者哉</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">不责于人所不能</text>
</svg>