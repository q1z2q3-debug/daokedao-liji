<path d="M166,268 Q191,292 216,268 Z" fill="#DCD5C8" stroke="#7C6D5C" stroke-width="1.0"/>
<text x="191" y="328" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">朝奠</text>
