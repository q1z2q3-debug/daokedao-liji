="240" r="2.5" fill="#7C6D5C"/><circle cx="410" cy="240" r="2.5" fill="#7C6D5C"/><circle cx="440" cy="240" r="2.5" fill="#7C6D5C"/><circle cx="470" cy="240" r="2.5" fill="#7C6D5C"/><circle cx="320" cy="268" r="2.5" fill="#7C6D5C"/><circle cx="350" cy="268" r="2.5" fill="#7C6D5C"/><circle cx="380" cy="268" r="2.5" fill="#7C6D5C"/><circle cx="410" cy="268" r="2.5" fill="#7C6D5C"/><circle cx="440" cy="268" r="2.5" fill="#7C6D5C"/><circle cx="470" cy="268" r="2.5" fill="#7C6D5C"/><text x="520" y="244" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9.5" fill="#7C6D5C" text-anchor="start" letter-spacing="0">十二事</text><text x="520" y="262" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9" fill="#9A9186" text-anchor="start" letter-spacing="0">服·车·身·食·言·人</text><text x="130" y="330" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="11" fill="#25211D" text-anchor="start" letter-spacing="0">不饰己</text><text x="130" y="356" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="11" fill="#25211D" text-anchor="start" letter-spacing="0">不说人以无罪</text><line x1="130" y1="368" x2="262" y2="368" stroke="#DCD5C8" stroke-width="0.6"/><text x="130" y="392" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="9.5" fill="#9A9186" text-anchor="start" letter-spacing="0">善则称君，过则称己</text><line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.8" stroke-dasharray="3,3"/><text x="70" y="470" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="13" fill="#25211D" text-anchor="start" letter-spacing="0">失去所归，先守一段不出声的日子。</text><text x="700" y="486" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" font-size="11" fill="#25211D" text-anchor="middle" letter-spacing="0">图二 · 去国之丧</text></svg>